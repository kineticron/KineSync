html,
body,
#app {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: transparent;
}
body {
  color: white;
  font-family: "SF Pro Display", "SF Pro Text", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
  touch-action: manipulation;
}
#app,
#amll-root {
  position: absolute;
  inset: 0;
  background: transparent;
}
.static-lyrics-root {
  position: absolute;
  inset: 0;
  box-sizing: border-box;
  overflow-x: hidden;
  overflow-y: auto;
  padding: 150px 28px 280px;
  scrollbar-width: none;
  overscroll-behavior: contain;
  -webkit-overflow-scrolling: touch;
  touch-action: pan-y;
}
.static-lyrics-root::-webkit-scrollbar {
  display: none;
}
.static-lyrics-root[hidden] {
  display: none;
}
.static-lyrics-line {
  box-sizing: border-box;
  width: 100%;
  max-width: 300px;
  margin: 0 0 14px;
  color: #fff;
  font-size: calc(26px * var(--ks-font-scale, 1));
  line-height: 1.46;
  font-weight: 600;
  letter-spacing: 0.15px;
  white-space: pre-wrap;
}
.static-lyrics-translation {
  margin-top: 6px;
  color: rgba(255,255,255,0.68);
  font-size: calc(18px * var(--ks-font-scale, 1));
  line-height: 1.44;
  font-weight: 500;
  letter-spacing: 0.1px;
}
.static-lyrics-background {
  margin-top: 5px;
  color: rgba(255,255,255,0.78);
  font-size: calc(18px * var(--ks-font-scale, 1));
  line-height: 1.4;
  font-weight: 500;
}
.static-lyrics-background-translation {
  margin-top: 2px;
  color: rgba(255,255,255,0.58);
  font-size: calc(15px * var(--ks-font-scale, 1));
  line-height: 1.4;
  font-weight: 500;
}
.static-lyrics-root.landscape .static-lyrics-line {
  margin-left: auto;
  text-align: right;
}
.static-lyrics-root .kinesync-credits-footer {
  max-width: 300px;
  margin-top: 18px;
  padding-left: 0;
  padding-right: 0;
}
.static-lyrics-root.landscape .kinesync-credits-footer {
  margin-left: auto;
  text-align: right;
}
.kinesync-amll-player {
  touch-action: none;
  background: transparent;
  --amll-lp-color: #fff;
  --amll-lp-font-size: calc(36px * var(--ks-font-scale, 1));
  --amll-lp-hover-bg-color: transparent;
  font-family: "SF Pro Display", "SF Pro Text", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  font-weight: 800;
  overflow: visible;
}
.kinesync-amll-player.landscape {
  --amll-lp-font-size: calc(32px * var(--ks-font-scale, 1));
}
.kinesync-amll-player [class*="lyricLineWrapper"] {
  box-sizing: border-box;
  max-width: calc(100% - 44px);
  margin-top: 8px;
  margin-bottom: 8px;
  overflow: visible !important;
}
.kinesync-amll-player.landscape [class*="lyricLineWrapper"] {
  max-width: calc(100% - 56px);
  margin-top: 10px;
  margin-bottom: 10px;
}
.kinesync-amll-player [class*="lyricLineWrapper"]:not([style*="right"]) {
  margin-left: 22px;
}
.kinesync-amll-player [class*="lyricLineWrapper"][style*="right"] {
  margin-right: 22px;
}
.kinesync-amll-player.landscape [class*="lyricLineWrapper"]:not([style*="right"]) {
  margin-left: 28px;
}
.kinesync-amll-player.landscape [class*="lyricLineWrapper"][style*="right"] {
  margin-right: 28px;
}
.kinesync-amll-player [class*="lyricMainLine"],
.kinesync-amll-player [class*="lyricSubLine"] {
  font-family: "SF Pro Display", "SF Pro Text", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  font-weight: 800;
}
.kinesync-amll-player [class*="lyricSubLine"] {
  font-weight: 700;
}
.kinesync-amll-player .kinesync-selected-line,
.kinesync-selected-line {
  background-color: rgba(255,255,255,0.13) !important;
}
.kinesync-amll-player .kinesync-pressed-line,
.kinesync-pressed-line {
  background-color: rgba(255,255,255,0.16) !important;
}
.kinesync-credits-footer {
  box-sizing: border-box;
  width: min(88%, 720px);
  margin: 18px 0 0 0;
  padding: 18px 16px 32px;
  color: rgba(255,255,255,0.56);
  font-family: "SF Pro Display", "SF Pro Text", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  font-size: 13px;
  line-height: 18px;
  font-weight: 600;
  cursor: pointer;
}
.kinesync-amll-player.landscape .kinesync-credits-footer {
  margin-left: auto;
  text-align: right;
}
.kinesync-credits-footer:active {
  color: rgba(255,255,255,0.86);
}
.kinesync-credits-strong {
  font-weight: 800;
}
.kinesync-credits-profile {
  display: flex;
  align-items: center;
  gap: 6px;
}
.kinesync-amll-player.landscape .kinesync-credits-profile,
.static-lyrics-root.landscape .kinesync-credits-profile {
  justify-content: flex-end;
}
.kinesync-credits-avatar {
  display: block;
  width: 18px;
  height: 18px;
  flex: 0 0 18px;
  border-radius: 50%;
  object-fit: cover;
  background: rgba(255,255,255,0.12);
}
.empty {
  position: absolute;
  left: 26px;
  right: 26px;
  top: 45%;
  transform: translateY(-50%);
  text-align: center;
  pointer-events: none;
}
.empty-title {
  color: #fff;
  font-size: 27px;
  line-height: 1.16;
  font-weight: 800;
}
.empty-sub {
  margin-top: 10px;
  color: rgba(255,255,255,0.62);
  font-size: 13px;
  line-height: 1.35;
  font-weight: 560;
}
</style>

  </div>
