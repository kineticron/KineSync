# Automated iOS simulator testing harness with deterministic fake playback clock
# Builds unsigned Release arm64 simulator .app bundle, boots simulator, executes scenario,
# captures real screenshots and perf metrics, and validates visual assertions.

name: iOS Simulator Test

# Manual only: review and push ci-sim first, then dispatch once with baseline_ref=main.
on:
  workflow_dispatch:
    inputs:
      baseline_ref:
        description: 'Optional baseline git ref for screenshot comparison'
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: ios-simulator-test-${{ github.ref }}-${{ github.event.inputs.baseline_ref || 'nobase' }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  ios-simulator-test:
    runs-on: xcode-27
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Reserve cleanup and upload time
        run: echo "SIMULATOR_CI_DEADLINE_MS=$(( $(date +%s) * 1000 + 26 * 60 * 1000 ))" >> "${GITHUB_ENV}"

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ExpoLyrics/package-lock.json

      - name: Install ccache
        run: |
          set -euo pipefail
          if ! command -v ccache >/dev/null 2>&1; then
            brew install ccache
          fi
          ccache --version
          REAL_CLANG="$(xcrun --sdk iphonesimulator -f clang)"
          WRAP_DIR="${RUNNER_TEMP}/ccache-wrap"
          mkdir -p "${WRAP_DIR}"
          printf '#!/bin/sh\nexec ccache "%s" "$@"\n' "${REAL_CLANG}" > "${WRAP_DIR}/clang"
          chmod +x "${WRAP_DIR}/clang"
          "${WRAP_DIR}/clang" --version
          {
            echo "KINESYNC_USE_CCACHE=1"
            echo "KINESYNC_CC_WRAPPER=${WRAP_DIR}/clang"
            echo "CCACHE_BASEDIR=${GITHUB_WORKSPACE}"
            echo "CCACHE_MAXSIZE=2G"
            echo "CCACHE_SLOPPINESS=pch_defines,time_macros"
          } >> "${GITHUB_ENV}"

      - name: Verify iOS 27 simulator toolchain
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64 # arm64-only simulator product requires an Apple Silicon host
          xcodebuild -version
          xcodebuild -showsdks
          xcrun simctl list devices available -j >/dev/null

      - name: Install JS dependencies
        working-directory: ExpoLyrics
        timeout-minutes: 5
        run: npm ci

      - name: Cache compatibility
        id: compatibility
        run: |
          set -euo pipefail
          # Exact compiler/SDK/CocoaPods/ccache identity, not a moving runner label.
          ID="$( { xcodebuild -version; xcrun --sdk iphonesimulator --show-sdk-version; pod --version; ccache --version; uname -m; } | shasum -a 256 | cut -d ' ' -f 1)"
          echo "id=${ID}" >> "${GITHUB_OUTPUT}"
          echo "CCACHE_DIR=${GITHUB_WORKSPACE}/../kinesync-ios-ccache" >> "${GITHUB_ENV}"

      - name: Expo prebuild (iOS)
        timeout-minutes: 5
        working-directory: ExpoLyrics
        run: npx expo prebuild --clean --platform ios --no-install

      - name: Restore CocoaPods cache
        id: pods_cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ExpoLyrics/ios/Pods
            ExpoLyrics/ios/Podfile.lock
            ~/.cocoapods
            ~/Library/Caches/CocoaPods
          key: ios-sim-pods-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.compatibility.outputs.id }}-${{ hashFiles('ExpoLyrics/package-lock.json', 'ExpoLyrics/ios/Podfile', 'ExpoLyrics/ios/Podfile.properties.json') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ios-sim-pods-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.compatibility.outputs.id }}-${{ hashFiles('ExpoLyrics/package-lock.json', 'ExpoLyrics/ios/Podfile', 'ExpoLyrics/ios/Podfile.properties.json') }}-

      - name: Install Pods
        id: install_pods
        working-directory: ExpoLyrics/ios
        timeout-minutes: 5
        run: |
          set -euo pipefail
          pod install
          test -s Podfile.lock

      # Save validated Pods before expensive native work; this cost is inside the work budget.
      - name: Save CocoaPods cache
        if: ${{ !cancelled() && steps.install_pods.outcome == 'success' && steps.pods_cache.outputs.cache-primary-key != '' }}
        timeout-minutes: 1
        continue-on-error: true
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ExpoLyrics/ios/Pods
            ExpoLyrics/ios/Podfile.lock
            ~/.cocoapods
            ~/Library/Caches/CocoaPods
          key: ${{ steps.pods_cache.outputs.cache-primary-key }}

      - name: Restore Release arm64 compiler cache
        id: compiler_cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ${{ github.workspace }}/../kinesync-ios-derived-sim
            ${{ github.workspace }}/../kinesync-ios-ccache
          key: ios-sim-release-arm64-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.compatibility.outputs.id }}-${{ hashFiles('ExpoLyrics/ios/Podfile.lock', 'ExpoLyrics/package-lock.json', 'ExpoLyrics/ios/Podfile', 'ExpoLyrics/ios/Podfile.properties.json', 'ExpoLyrics/app.json', 'ExpoLyrics/scripts/build-simulator-app.mjs') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ios-sim-release-arm64-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.compatibility.outputs.id }}-${{ hashFiles('ExpoLyrics/ios/Podfile.lock', 'ExpoLyrics/package-lock.json', 'ExpoLyrics/ios/Podfile', 'ExpoLyrics/ios/Podfile.properties.json', 'ExpoLyrics/app.json', 'ExpoLyrics/scripts/build-simulator-app.mjs') }}-

      - name: Build Release arm64 simulator app bundle
        id: candidate_build
        working-directory: ExpoLyrics
        env:
          DERIVED_DATA_PATH: ${{ github.workspace }}/../kinesync-ios-derived-sim
          EXPO_PUBLIC_SIMULATOR_TEST: "1"
        run: |
          set -euo pipefail
          if [ "${KINESYNC_USE_CCACHE:-0}" = "1" ] && command -v ccache >/dev/null 2>&1; then
            ccache --zero-stats
          fi
          mkdir -p .expo
          node scripts/run-with-ci-budget.mjs node scripts/build-simulator-app.mjs --derived-data-path "${DERIVED_DATA_PATH}" 2>&1 | tee .expo/build-simulator.log

      - name: Run iOS Simulator Test Harness
        working-directory: ExpoLyrics
        run: |
          set -euo pipefail
          APP_PATH="$(cat ios/.built_app_path)"
          node scripts/run-ios-simulator-test.mjs --app-path "${APP_PATH}" --output-dir .expo/simulator-test-output --timeout-minutes 6

      # Save partial candidate work even after failure. One minute here plus the
      # two-minute artifact cap leaves margin beyond the 26-minute work deadline.
      - name: Save partial Release arm64 compiler cache
        if: ${{ !cancelled() && steps.candidate_build.outcome != 'skipped' && steps.compiler_cache.outputs.cache-primary-key != '' }}
        timeout-minutes: 1
        continue-on-error: true
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ${{ github.workspace }}/../kinesync-ios-derived-sim
            ${{ github.workspace }}/../kinesync-ios-ccache
          key: ${{ steps.compiler_cache.outputs.cache-primary-key }}

      - name: Run Baseline Comparison (if requested)
        # A candidate scenario failure must not skip the requested baseline evidence.
        if: ${{ !cancelled() && steps.candidate_build.outcome == 'success' && github.event.inputs.baseline_ref != '' }}
        env:
          BASELINE_REF: ${{ github.event.inputs.baseline_ref }}
          DERIVED_BASELINE: ${{ github.workspace }}/../kinesync-ios-derived-baseline
        run: |
          node ExpoLyrics/scripts/run-with-ci-budget.mjs bash <<'BASELINE'
          set -euo pipefail
          if [ -z "${BASELINE_REF}" ]; then
            echo "No baseline ref provided."
            exit 0
          fi

          # Ref syntax is insufficient: baseline scripts execute only from trusted main history.
          BASELINE_COMMIT="$(node ExpoLyrics/scripts/resolve-trusted-simulator-baseline.mjs "${BASELINE_REF}")"
          echo "Resolved trusted baseline commit: ${BASELINE_COMMIT}"

          git worktree add ../kinesync-baseline "${BASELINE_COMMIT}"

          # Apply minimal harness protocol and integration patch to baseline
          node ExpoLyrics/scripts/prepare-baseline-harness.mjs --baseline-dir ../kinesync-baseline

          pushd ../kinesync-baseline/ExpoLyrics
          npm ci
          npx expo prebuild --clean --platform ios

          # Build baseline simulator app using consistent discovery and actual xcodebuild
          mkdir -p "${GITHUB_WORKSPACE}/ExpoLyrics/.expo"
          node scripts/build-simulator-app.mjs --derived-data-path "${DERIVED_BASELINE}" 2>&1 | tee "${GITHUB_WORKSPACE}/ExpoLyrics/.expo/build-baseline-simulator.log"
          BASELINE_APP="$(cat ios/.built_app_path)"

          BASELINE_STATUS=0
          node scripts/run-ios-simulator-test.mjs --app-path "${BASELINE_APP}" --output-dir "${GITHUB_WORKSPACE}/ExpoLyrics/.expo/baseline-test-output" --timeout-minutes 6 || BASELINE_STATUS=$?
          popd

          # Compare branch vs baseline screenshots
          COMPARISON_STATUS=0
          node ExpoLyrics/scripts/compare-simulator-screenshots.mjs --branch-dir ExpoLyrics/.expo/simulator-test-output --baseline-dir ExpoLyrics/.expo/baseline-test-output --baseline-ref "${BASELINE_REF}" --output ExpoLyrics/.expo/comparison-report.md || COMPARISON_STATUS=$?
          cat ExpoLyrics/.expo/comparison-report.md >> "${GITHUB_STEP_SUMMARY}"
          if [ "${BASELINE_STATUS}" -ne 0 ] || [ "${COMPARISON_STATUS}" -ne 0 ]; then exit 1; fi

          BASELINE

      - name: Publish Step Summary
        if: always()
        run: |
          for report in ExpoLyrics/.expo/{simulator,baseline}-test-output/{simulator-summary,runner-failure}.md; do
            if [ -f "${report}" ]; then cat "${report}" >> "${GITHUB_STEP_SUMMARY}"; fi
          done

      - name: Upload Simulator Test Artifacts
        timeout-minutes: 2
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ios-simulator-test-artifacts
          path: |
            ExpoLyrics/.expo/simulator-test-output/
            ExpoLyrics/.expo/comparison-report.md
            ExpoLyrics/.expo/*.log
            ExpoLyrics/.expo/baseline-test-output/
          include-hidden-files: true
          retention-days: 14
