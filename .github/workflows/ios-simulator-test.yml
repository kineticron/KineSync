# Automated iOS simulator testing harness with deterministic fake playback clock
# Builds unsigned Release arm64 simulator .app bundle, boots simulator, executes scenario,
# captures real screenshots and perf metrics, and validates screenshot artifact delivery.

name: iOS Simulator Test

# Manual only: review and push ci-sim first, then dispatch once with baseline_ref=main.
on:
  workflow_dispatch:
    inputs:
      diagnostic_only:
        description: 'Run only the small simulator diagnostic (no build or harness)'
        required: false
        default: false
        type: boolean
      candidate_ref:
        description: 'Candidate source branch or SHA from this repository'
        required: false
        default: 'main'
        type: string
      baseline_ref:
        description: 'Baseline source ref reachable from trusted main'
        required: false
        default: 'main'
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: ios-simulator-test-${{ github.ref }}-${{ github.event.inputs.baseline_ref || 'nobase' }}-${{ github.event.inputs.diagnostic_only || 'false' }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  resolve:
    if: github.event.inputs.diagnostic_only != 'true'
    runs-on: ubuntu-latest
    outputs:
      candidate: ${{ steps.refs.outputs.candidate }}
      baseline: ${{ steps.refs.outputs.baseline }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
      - id: refs
        env:
          CANDIDATE_REF: ${{ inputs.candidate_ref }}
          BASELINE_REF: ${{ inputs.baseline_ref }}
        run: |
          set -euo pipefail
          CANDIDATE="$(node ExpoLyrics/scripts/resolve-trusted-simulator-baseline.mjs "${CANDIDATE_REF}" --candidate)"
          BASELINE="$(node ExpoLyrics/scripts/resolve-trusted-simulator-baseline.mjs "${BASELINE_REF}")"
          echo "candidate=${CANDIDATE}" >> "${GITHUB_OUTPUT}"
          echo "baseline=${BASELINE}" >> "${GITHUB_OUTPUT}"

  diagnostic:
    if: github.event.inputs.diagnostic_only == 'true'
    runs-on: macos-26
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Observe simulator startup (no build or app)
        timeout-minutes: 15
        run: python3 scripts/simulator-diagnostic.py
      - name: Preserve diagnostic evidence
        if: always()
        timeout-minutes: 4
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: simulator-diagnostic
          path: simulator-diagnostic/
          if-no-files-found: error

  native-apps:
    if: github.event.inputs.diagnostic_only != 'true'
    needs: resolve
    runs-on: macos-26
    timeout-minutes: 120
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      EXPO_NO_DOTENV: '1'
      EXPO_PUBLIC_SIMULATOR_TEST: '1'
      EXPO_PUBLIC_SIMULATOR_TEST_BUILD: release-arm64
      USE_CCACHE: '1'
      CCACHE_COMPILERCHECK: content
      CCACHE_MAXSIZE: 512M
      CI: '1'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ExpoLyrics/package-lock.json
      - name: Select and verify installed toolchain
        timeout-minutes: 5
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          test -d "${DEVELOPER_DIR}"
          sudo xcode-select --switch "${DEVELOPER_DIR}"
          test "$(xcode-select -p)" = "${DEVELOPER_DIR}"
          xcodebuild -checkFirstLaunchStatus
          xcodebuild -version | grep -Fx 'Xcode 26.6'
          xcrun --sdk iphonesimulator --show-sdk-version | grep -Fx '26.5'
          if ! command -v ccache >/dev/null 2>&1; then brew install ccache; fi
          ccache --version
          ccache --get-config compiler_check | grep -Fx content
          echo "CCACHE_DIR=$(cd .. && pwd -P)/kinesync-ios-ccache" >> "${GITHUB_ENV}"
          echo "CCACHE_BASEDIR=$(cd .. && pwd -P)" >> "${GITHUB_ENV}"
          echo "SIMULATOR_CI_DEADLINE_MS=$(( $(date +%s) * 1000 + 85 * 60 * 1000 ))" >> "${GITHUB_ENV}"
      - name: Prepare exact sources and strict native fingerprints
        id: pair
        timeout-minutes: 15
        env:
          CANDIDATE_SHA: ${{ needs.resolve.outputs.candidate }}
          BASELINE_SHA: ${{ needs.resolve.outputs.baseline }}
        run: |
          set -euo pipefail
          mkdir -p ExpoLyrics/.expo/pair
          node ExpoLyrics/scripts/run-with-ci-budget.mjs node ExpoLyrics/scripts/prepare-simulator-pair.mjs 2>&1 | tee ExpoLyrics/.expo/pair/prepare.log
      - name: Restore verified baseline native entry
        id: baseline_cache
        if: ${{ steps.pair.outputs.baseline_key != '' }}
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ env.CCACHE_BASEDIR }}/kinesync-native-cache/${{ steps.pair.outputs.baseline_key }}
          key: ios-sim-app-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.pair.outputs.baseline_key }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ios-sim-app-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.pair.outputs.baseline_key }}-
      - name: Restore verified candidate native entry
        id: candidate_cache
        if: ${{ steps.pair.outputs.candidate_key != '' && steps.pair.outputs.candidate_key != steps.pair.outputs.baseline_key }}
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ env.CCACHE_BASEDIR }}/kinesync-native-cache/${{ steps.pair.outputs.candidate_key }}
          key: ios-sim-app-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.pair.outputs.candidate_key }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ios-sim-app-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.pair.outputs.candidate_key }}-
      - name: Validate restored native entries
        id: cache_before
        run: node ExpoLyrics/scripts/inspect-simulator-cache.mjs before
      - name: Restore bounded content-checked compiler cache on native miss
        id: compiler_cache
        if: steps.cache_before.outputs.needs_native == 'true'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ios-sim-ccache-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.pair.outputs.compiler_key }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ios-sim-ccache-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.pair.outputs.compiler_key }}-
      - name: Build native once on equality and freshly bundle both variants
        id: build
        run: |
          set -euo pipefail
          ccache --zero-stats
          node ExpoLyrics/scripts/run-with-ci-budget.mjs node ExpoLyrics/scripts/build-simulator-pair.mjs 2>&1 | tee ExpoLyrics/.expo/pair/build.log
      - name: Measure cache bytes and decide bounded publication
        id: cache_policy
        if: ${{ !cancelled() && steps.cache_before.outcome == 'success' }}
        run: |
          set -euo pipefail
          ccache --max-size 512M
          ccache --cleanup
          node ExpoLyrics/scripts/inspect-simulator-cache.mjs after
      - name: Save new verified baseline native entry
        id: baseline_save
        if: ${{ !cancelled() && steps.cache_policy.outputs.baseline_save == 'true' }}
        timeout-minutes: 4
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ env.CCACHE_BASEDIR }}/kinesync-native-cache/${{ steps.pair.outputs.baseline_key }}
          key: ${{ steps.baseline_cache.outputs.cache-primary-key }}
      - name: Verify baseline native cache save on server
        if: ${{ !cancelled() && steps.baseline_save.outcome == 'success' }}
        timeout-minutes: 2
        env:
          GH_TOKEN: ${{ github.token }}
          CACHE_LABEL: baseline-app
          CACHE_KEY: ${{ steps.baseline_cache.outputs.cache-primary-key }}
        run: node ExpoLyrics/scripts/verify-ci-cache.mjs
      - name: Save new verified candidate native entry
        id: candidate_save
        if: ${{ !cancelled() && steps.cache_policy.outputs.candidate_save == 'true' }}
        timeout-minutes: 4
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ env.CCACHE_BASEDIR }}/kinesync-native-cache/${{ steps.pair.outputs.candidate_key }}
          key: ${{ steps.candidate_cache.outputs.cache-primary-key }}
      - name: Verify candidate native cache save on server
        if: ${{ !cancelled() && steps.candidate_save.outcome == 'success' }}
        timeout-minutes: 2
        env:
          GH_TOKEN: ${{ github.token }}
          CACHE_LABEL: candidate-app
          CACHE_KEY: ${{ steps.candidate_cache.outputs.cache-primary-key }}
        run: node ExpoLyrics/scripts/verify-ci-cache.mjs
      - name: Save bounded compiler work only after a native miss
        id: compiler_save
        if: ${{ !cancelled() && steps.cache_policy.outputs.compiler_save == 'true' }}
        timeout-minutes: 3
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ steps.compiler_cache.outputs.cache-primary-key }}
      - name: Verify compiler cache save on server
        if: ${{ !cancelled() && steps.compiler_save.outcome == 'success' }}
        timeout-minutes: 2
        env:
          GH_TOKEN: ${{ github.token }}
          CACHE_LABEL: compiler
          CACHE_KEY: ${{ steps.compiler_cache.outputs.cache-primary-key }}
        run: node ExpoLyrics/scripts/verify-ci-cache.mjs
      - name: Native cache diagnostics
        if: always()
        env:
          STEP_RESULTS: ${{ toJSON(steps) }}
          CANDIDATE_SHA: ${{ needs.resolve.outputs.candidate }}
          BASELINE_SHA: ${{ needs.resolve.outputs.baseline }}
        run: |
          mkdir -p ExpoLyrics/.expo/pair
          ccache --show-stats > ExpoLyrics/.expo/pair/ccache.log 2>&1 || true
          node --input-type=module <<'STATUS'
          import fs from 'node:fs';
          const steps = JSON.parse(process.env.STEP_RESULTS);
          const status = { candidate: process.env.CANDIDATE_SHA, baseline: process.env.BASELINE_SHA,
            steps: Object.fromEntries(['pair', 'baseline_cache', 'candidate_cache', 'build', 'cache_policy', 'baseline_save', 'candidate_save', 'compiler_save'].map(id => [id, steps[id]?.outcome || 'not reached'])) };
          fs.writeFileSync('ExpoLyrics/.expo/pair/native-status.json', JSON.stringify(status, null, 2));
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `Native app preparation: ${JSON.stringify(status)}\n`);
          STATUS
      - name: Upload prepared variant apps
        timeout-minutes: 3
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ios-simulator-prepared-apps
          path: |
            ExpoLyrics/.expo/pair/apps/*.tar.gz
            ExpoLyrics/.expo/pair/apps/*-provenance.json
          compression-level: 0
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3
      - name: Preserve native fingerprints, timings and build evidence
        timeout-minutes: 3
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ios-simulator-native-evidence
          path: |
            ExpoLyrics/.expo/pair/*.json
            ExpoLyrics/.expo/pair/*.log
            ExpoLyrics/.expo/cache-verification-*.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  ios-simulator-test:
    if: github.event.inputs.diagnostic_only != 'true'
    needs: [resolve, native-apps]
    runs-on: macos-26
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        variant: [candidate, baseline]
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      SIMULATOR_DISPOSABLE_CI: '1'
      SIMULATOR_REQUIRE_PROVENANCE: '1'
      SIMULATOR_PROVENANCE_FILE: ${{ github.workspace }}/prepared-apps/${{ matrix.variant }}-provenance.json
      EXPO_NO_DOTENV: '1'
      SOURCE_SHA: ${{ needs.resolve.outputs[matrix.variant] }}
      VARIANT: ${{ matrix.variant }}
      HARNESS_SHA: ${{ github.sha }}
    steps:
      - name: Record job work start
        run: |
          echo "SIMULATOR_CI_STARTED_MS=$(( $(date +%s) * 1000 ))" >> "${GITHUB_ENV}"
          echo "SIMULATOR_CI_DEADLINE_MS=$(( $(date +%s) * 1000 + 45 * 60 * 1000 ))" >> "${GITHUB_ENV}"
      - name: Checkout trusted harness
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ExpoLyrics/package-lock.json
      - name: Install harness dependencies
        working-directory: ExpoLyrics
        timeout-minutes: 5
        run: npm ci --ignore-scripts
      - name: Select installed Xcode and prepare native rotation
        timeout-minutes: 10
        run: |
          set -euo pipefail
          sudo xcode-select --switch "${DEVELOPER_DIR}"
          test "$(xcode-select -p)" = "${DEVELOPER_DIR}"
          TOOL_DIR="${RUNNER_TEMP}/kinesync-rotation-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p ExpoLyrics/.expo
          node ExpoLyrics/scripts/run-with-ci-budget.mjs node ExpoLyrics/scripts/prepare-simulator-rotation.mjs "${TOOL_DIR}" 2>&1 | tee ExpoLyrics/.expo/rotation-tool-prepare.log
          echo "SIMULATOR_ROTATION_TOOL_DIR=${TOOL_DIR}" >> "${GITHUB_ENV}"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ios-simulator-prepared-apps
          path: prepared-apps
      - name: Extract exact variant and record refs
        env:
          CANDIDATE_SHA: ${{ needs.resolve.outputs.candidate }}
          BASELINE_SHA: ${{ needs.resolve.outputs.baseline }}
        run: |
          set -euo pipefail
          mkdir -p prepared-apps/current ExpoLyrics/.expo
          tar -xzf "prepared-apps/${VARIANT}.tar.gz" -C prepared-apps/current
          echo "${CANDIDATE_SHA}" > ExpoLyrics/.expo/candidate-commit.txt
          echo "${BASELINE_SHA}" > ExpoLyrics/.expo/baseline-commit.txt
      - name: Run iOS Simulator Test Harness
        timeout-minutes: 40
        id: scenario
        working-directory: ExpoLyrics
        run: |
          set -euo pipefail
          node scripts/run-ios-simulator-test.mjs --app-path "${GITHUB_WORKSPACE}/prepared-apps/current/KineSync.app" --output-dir .expo/simulator-test-output --timeout-minutes 40
      - name: Publish Step Summary
        if: always()
        env:
          SCENARIO_RESULT: ${{ steps.scenario.outcome }}
        run: |
          mkdir -p ExpoLyrics/.expo
          node --input-type=module <<'STATUS'
          import fs from 'node:fs';
          const status = { variant: process.env.VARIANT, sourceSha: process.env.SOURCE_SHA, harnessSha: process.env.HARNESS_SHA,
            scenario: process.env.SCENARIO_RESULT || 'not reached (preparation failure)' };
          fs.writeFileSync('ExpoLyrics/.expo/status-manifest.json', JSON.stringify(status, null, 2));
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `Simulator variant: ${JSON.stringify(status)}\n`);
          STATUS
          for report in ExpoLyrics/.expo/simulator-test-output/{simulator-summary,runner-failure}.md; do
            if [ -f "${report}" ]; then cat "${report}" >> "${GITHUB_STEP_SUMMARY}"; fi
          done
      - name: Upload Simulator Test Artifacts
        timeout-minutes: 2
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ios-simulator-${{ matrix.variant }}-artifacts
          path: |
            ExpoLyrics/.expo/simulator-test-output/
            ExpoLyrics/.expo/*.log
            ExpoLyrics/.expo/*-commit.txt
            ExpoLyrics/.expo/status-manifest.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  compare:
    needs: [resolve, native-apps, ios-simulator-test]
    if: ${{ always() && !cancelled() && github.event.inputs.diagnostic_only != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
        working-directory: ExpoLyrics
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: ios-simulator-*-artifacts
          path: comparison-input
      - name: Validate screenshot artifact pairs for Kat
        id: comparison
        env:
          BUILD_RESULT: ${{ needs.ios-simulator-test.result }}
          CANDIDATE_SHA: ${{ needs.resolve.outputs.candidate }}
          BASELINE_REF: ${{ needs.resolve.outputs.baseline }}
        run: |
          BASELINE_SHA="$(cat comparison-input/ios-simulator-baseline-artifacts/baseline-commit.txt)"
          test "${BASELINE_SHA}" = "${BASELINE_REF}"
          test "$(cat comparison-input/ios-simulator-candidate-artifacts/candidate-commit.txt)" = "${CANDIDATE_SHA}"
          test "${BUILD_RESULT}" = success
          node ExpoLyrics/scripts/compare-simulator-screenshots.mjs --branch-dir comparison-input/ios-simulator-candidate-artifacts/simulator-test-output --baseline-dir comparison-input/ios-simulator-baseline-artifacts/simulator-test-output --baseline-ref "${BASELINE_SHA}" --output comparison-report.md
      - name: Publish comparison summary
        if: always()
        env:
          COMPARISON_OUTCOME: ${{ steps.comparison.outcome }}
          BUILD_RESULT: ${{ needs.ios-simulator-test.result }}
          CANDIDATE_SHA: ${{ needs.resolve.outputs.candidate }}
        run: |
          node --input-type=module <<'STATUS'
          import fs from 'node:fs';
          const status = { candidate: process.env.CANDIDATE_SHA, builds: process.env.BUILD_RESULT, comparison: process.env.COMPARISON_OUTCOME || 'not reached (preparation/download failure)' };
          fs.writeFileSync('comparison-status.json', JSON.stringify(status, null, 2));
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `\nComparison status: ${status.comparison}; build jobs: ${status.builds}; candidate: ${status.candidate}\n`);
          STATUS
          if [ -f comparison-report.md ]; then cat comparison-report.md >> "${GITHUB_STEP_SUMMARY}"; else echo "Comparison unavailable; inspect failed preparation/download steps." >> "${GITHUB_STEP_SUMMARY}"; fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: ios-simulator-screenshot-review
          path: |
            comparison-report.md
            comparison-status.json
            comparison-report.md.manifest.json
            comparison-input/
          if-no-files-found: error

      - name: Report screenshot artifacts to Kat
        if: success()
        run: echo "Kat, both candidate and baseline screenshot artifacts are available for review. No visual verdict was applied." >> "${GITHUB_STEP_SUMMARY}"
