# Manual iOS development-client build without Apple Developer Portal signing.
# Produces a Debug IPA with Expo development tools that you can re-sign locally (e.g. Sideloadly).
# We disable signing entirely for CI so Pod/library targets are not asked to
# sign with an empty identity.

name: iOS development build

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-development-build-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  ios-development-build:
    runs-on: macos-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ExpoLyrics/package-lock.json

      - name: Install ccache
        run: |
          set -euo pipefail
          if ! command -v ccache >/dev/null 2>&1; then
            brew install ccache
          fi
          ccache --version
          # Xcode spawns CC as a literal binary path (no shell splitting),
          # so `CC="ccache clang"` fails with "unable to spawn process".
          # Instead install a wrapper named `clang` that forwards to the real
          # toolchain compiler through ccache; module scanners still see clang.
          REAL_CLANG="$(xcrun --sdk iphoneos -f clang)"
          WRAP_DIR="${RUNNER_TEMP}/ccache-wrap"
          mkdir -p "${WRAP_DIR}"
          printf '#!/bin/sh\nexec ccache "%s" "$@"\n' "${REAL_CLANG}" > "${WRAP_DIR}/clang"
          chmod +x "${WRAP_DIR}/clang"
          "${WRAP_DIR}/clang" --version
          {
            echo "KINESYNC_USE_CCACHE=1"
            echo "KINESYNC_CC_WRAPPER=${WRAP_DIR}/clang"
            echo "CCACHE_BASEDIR=${GITHUB_WORKSPACE}"
            echo "CCACHE_MAXSIZE=2G"
            echo "CCACHE_SLOPPINESS=pch_defines,time_macros"
          } >> "${GITHUB_ENV}"

      - name: Install JS dependencies
        working-directory: ExpoLyrics
        run: npm ci

      - name: Expo prebuild (iOS)
        working-directory: ExpoLyrics
        run: npx expo prebuild --clean --platform ios

      # Prebuild wipes ios/ on every run, so pod downloads, cached
      # compilation and DerivedData restart from zero without these.
      # DerivedData lives outside ios/ at a Debug-only path that is stable
      # across fresh runner VMs (separate from the unsigned workflow's
      # Release cache), which is what makes the restore reusable.
      - name: Restore DerivedData, ccache and CocoaPods caches
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ${{ github.workspace }}/../kinesync-ios-derived-debug
            ${{ env.HOME }}/Library/Caches/ccache
            ${{ env.HOME }}/.cocoapods
            ${{ env.HOME }}/Library/Caches/CocoaPods
          key: ios-debug-caches-${{ runner.os }}-${{ hashFiles('ExpoLyrics/ios/Podfile.lock', 'ExpoLyrics/package-lock.json', 'ExpoLyrics/app.json') }}
          restore-keys: |
            ios-debug-caches-${{ runner.os }}-

      - name: Verify Live Activity native target
        working-directory: ExpoLyrics
        run: |
          npm run test:live-activity
          python3 scripts/check-ios-live-activity.py
          node scripts/verify-live-activity-project.js

      - name: Build Debug development client and locate .app
        env:
          DERIVED_DATA_PATH: ${{ github.workspace }}/../kinesync-ios-derived-debug
        run: |
          set -euo pipefail
          if [ "${KINESYNC_USE_CCACHE:-0}" = "1" ] && command -v ccache >/dev/null 2>&1; then
            ccache --zero-stats
          fi
          node <<'NODE'
          const { execSync, spawnSync } = require("child_process");
          const fs = require("fs");
          const path = require("path");

          const iosDir = path.join(process.env.GITHUB_WORKSPACE, "ExpoLyrics", "ios");
          const derived =
            process.env.DERIVED_DATA_PATH || path.join(iosDir, "build");
          const marker = path.join(iosDir, ".ci_built_app");

          const ws = fs
            .readdirSync(iosDir)
            .find((f) => f.endsWith(".xcworkspace"));
          if (!ws) throw new Error("No .xcworkspace in ios/");

          const listJson = execSync(
            `xcodebuild -workspace "${path.join(iosDir, ws)}" -list -json`,
            { encoding: "utf8", cwd: iosDir },
          );
          const j = JSON.parse(listJson);
          const schemes = j.workspace.schemes || [];
          const proj = fs
            .readdirSync(iosDir)
            .find((f) => f.endsWith(".xcodeproj"));
          const projBase = proj ? path.basename(proj, ".xcodeproj") : null;
          const scheme =
            (projBase && schemes.find((s) => s === projBase)) ||
            schemes.find((s) => !String(s).startsWith("Pods")) ||
            schemes[0];
          if (!scheme) throw new Error("No Xcode schemes found");

          console.log("iosDir:", iosDir);
          console.log("derivedDataPath:", derived);
          console.log("Using workspace:", ws, "scheme:", scheme);

          const signing = [
            "CODE_SIGNING_ALLOWED=NO",
            "CODE_SIGNING_REQUIRED=NO",
            "CODE_SIGN_STYLE=Manual",
            "DEVELOPMENT_TEAM=",
            "PROVISIONING_PROFILE_SPECIFIER=",
            "PROVISIONING_PROFILE=",
            "EXPANDED_CODE_SIGN_IDENTITY=",
            "COMPILER_INDEX_STORE_ENABLE=NO",
          ];

          // Route C-family compilation through a ccache wrapper (a real
          // executable named `clang`, since Xcode spawns CC without shell
          // splitting). The cache is content-addressed, so it stays valid
          // across fresh checkouts (unlike mtime-based DerivedData reuse) and
          // covers the React Native C++/ObjC bulk that dominates Debug build
          // time. Swift compilation is unaffected and still runs every build.
          const ccache =
            process.env.KINESYNC_USE_CCACHE === "1" &&
            process.env.KINESYNC_CC_WRAPPER
              ? [`CC=${process.env.KINESYNC_CC_WRAPPER}`]
              : [];

          const common = [
            "-workspace",
            path.join(iosDir, ws),
            "-scheme",
            scheme,
            "-configuration",
            "Debug",
            "-sdk",
            "iphoneos",
            "-destination",
            "generic/platform=iOS",
            "-derivedDataPath",
            derived,
            ...signing,
            ...ccache,
          ];

          function skipPath(p) {
            return /\/Pods\//.test(p) || /\/XCFrameworkIntermediates\//.test(p);
          }

          function listAppsUnder(root) {
            const apps = [];
            function walk(dir) {
              let entries;
              try {
                entries = fs.readdirSync(dir, { withFileTypes: true });
              } catch {
                return;
              }
              for (const ent of entries) {
                if (!ent.isDirectory()) continue;
                const p = path.join(dir, ent.name);
                if (skipPath(p)) continue;
                if (p.endsWith(".app")) apps.push(p);
                else walk(p);
              }
            }
            walk(root);
            return apps;
          }

          function pickApp(apps, scheme) {
            if (apps.length === 0) return null;
            const byScheme = apps.find((a) => a.endsWith(`/${scheme}.app`));
            if (byScheme) return byScheme;
            const inProducts = apps.filter((a) =>
              /Build\/Products\/Debug-iphoneos\//.test(a),
            );
            const pool = inProducts.length ? inProducts : apps;
            return pool.sort((a, b) => a.length - b.length)[0];
          }

          function runBuild(action, extra) {
            const args = [...common, ...extra, action];
            console.log("xcodebuild", args.join(" "));
            const r = spawnSync("xcodebuild", args, {
              stdio: "inherit",
              cwd: iosDir,
            });
            if (r.status === null || r.status !== 0) {
              process.exit(r.status === null ? 1 : r.status);
            }
          }

          runBuild("build", []);

          let apps = listAppsUnder(path.join(derived, "Build", "Products", "Debug-iphoneos"));
          if (apps.length === 0) apps = listAppsUnder(derived);

          let chosen = pickApp(apps, scheme);

          if (!chosen) {
            console.log("No .app after build; trying xcodebuild archive…");
            const archivePath = path.join(iosDir, "ExpoLyricsDevelopment.xcarchive");
            fs.rmSync(archivePath, { recursive: true, force: true });
            runBuild("archive", ["-archivePath", archivePath]);
            const archAppsDir = path.join(
              archivePath,
              "Products",
              "Applications",
            );
            apps = listAppsUnder(archAppsDir);
            chosen = pickApp(apps, scheme);
          }

          if (!chosen) {
            console.error("Could not locate host .app after build/archive.");
            console.error(
              "Under Debug-iphoneos:",
              listAppsUnder(
                path.join(derived, "Build", "Products", "Debug-iphoneos"),
              ),
            );
            process.exit(1);
          }

          console.log("Selected .app:", chosen);
          fs.writeFileSync(marker, chosen, "utf8");
          NODE
          if [ "${KINESYNC_USE_CCACHE:-0}" = "1" ] && command -v ccache >/dev/null 2>&1; then
            ccache --show-stats
          fi

      - name: Package IPA (Payload + zip)
        run: |
          set -euo pipefail
          MARKER="${GITHUB_WORKSPACE}/ExpoLyrics/ios/.ci_built_app"
          APP=$(head -1 "${MARKER}")
          if [[ ! -d "${APP}" ]]; then
            echo "Invalid path from ${MARKER}: ${APP}"
            exit 1
          fi
          echo "Packaging: ${APP}"
          STAGE="${RUNNER_TEMP}/ipa-payload"
          rm -rf "${STAGE}"
          mkdir -p "${STAGE}/Payload"
          APP_BASENAME=$(basename "${APP}")
          ditto "${APP}" "${STAGE}/Payload/${APP_BASENAME}"
          IPA="${GITHUB_WORKSPACE}/ExpoLyrics/ExpoLyrics-development.ipa"
          rm -f "${IPA}"
          ditto -c -k --sequesterRsrc --keepParent "${STAGE}/Payload" "${IPA}"
          python3 ExpoLyrics/scripts/verify-ios-live-activity.py "${IPA}" --expected-app "${APP}"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ExpoLyrics-development-ipa
          path: ExpoLyrics/ExpoLyrics-development.ipa
          if-no-files-found: error
