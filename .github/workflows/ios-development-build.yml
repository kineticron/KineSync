# Existing manual workflow, deliberately limited to the spike branch for automatic builds.
name: iOS development build

on:
  push:
    branches: [rust-renderer-spike]
    paths:
      - '.github/workflows/ios-development-build.yml'
      - 'scripts/ios-dev-ci/**'
      - 'scripts/test/ios-dev-ci.test.cjs'
      - 'ExpoLyrics/**'
      - 'native/lyrics-renderer/**'
      - 'DesktopBridge/test/fixtures/lrc-red/ZZA0P2622376.ttml'
      - '.cargo/**'
      - 'rust-toolchain*'
  workflow_dispatch:
    inputs:
      cache_mode:
        description: 'normal, cold (skip managed restores and seed), or warm (require exact hits)'
        type: choice
        options: [normal, cold, warm]
        default: normal
      cache_epoch:
        description: 'Same new alphanumeric/dash/underscore token for the controlled cold/warm pair'
        type: string
        default: routine

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  CACHE_MODE: ${{ inputs.cache_mode || 'normal' }}
  CACHE_EPOCH: ${{ inputs.cache_epoch || 'routine' }}

jobs:
  validate:
    name: Validate device CI contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
      - run: |
          node --check scripts/ios-dev-ci/ci.cjs
          node --test scripts/test/ios-dev-ci.test.cjs

  ios-development-build:
    # A spike push only registers/validates the existing workflow. The two
    # measured macOS builds are explicit coordinator dispatches after review.
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/rust-renderer-spike'
    needs: validate
    runs-on: xcode-27
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          # npm has its own epoch-scoped cache below, so cold really skips its restore.

      - name: Install compiler cache tool
        run: |
          set -euo pipefail
          if ! command -v ccache >/dev/null 2>&1; then brew install ccache; fi

      - name: Resolve absolute runner paths and toolchain identity
        id: plan
        run: node scripts/ios-dev-ci/ci.cjs init

      - name: Start dependency cache timing
        run: node scripts/ios-dev-ci/ci.cjs mark dependency-cache-restore

      - name: Restore npm download cache
        id: npm
        if: env.CACHE_MODE != 'cold'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ steps.plan.outputs.path-npm }}
          key: ${{ steps.plan.outputs.key-npm }}

      - name: Finish dependency cache timing
        if: always() && steps.plan.outcome == 'success'
        env:
          CI_JOB_STATUS: ${{ job.status }}
        run: node scripts/ios-dev-ci/ci.cjs span dependency-cache-restore

      - name: Install JS dependencies
        run: node scripts/ios-dev-ci/ci.cjs time npm-ci npm --prefix ExpoLyrics ci

      - name: Restore source-exact device-only Rust XCFramework
        id: prebuilt
        if: steps.plan.outputs.rust-enabled == 'true' && env.CACHE_MODE != 'cold'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ steps.plan.outputs.path-prebuilt }}
          key: ${{ steps.plan.outputs.key-prebuilt }}

      - name: Setup pinned device Rust toolchain and archive reader
        if: steps.plan.outputs.rust-enabled == 'true'
        env:
          TOOLCHAIN: ${{ steps.plan.outputs.rust-toolchain }}
          DEVICE_TARGET: ${{ steps.plan.outputs.rust-target }}
        run: rustup toolchain install "$TOOLCHAIN" --profile minimal --target "$DEVICE_TARGET" --component llvm-tools-preview

      - name: Cache Rust registry and device target work on a prebuilt miss
        id: rust
        if: steps.plan.outputs.rust-enabled == 'true' && steps.prebuilt.outputs.cache-hit != 'true'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          prefix-key: ${{ steps.plan.outputs.rust-shared }}
          workspaces: ${{ github.workspace }}/native/lyrics-renderer
          # Standard target/ resolves to plan.path-rustTarget. The action joins
          # arrow targets to the workspace, so never put an absolute RHS there.
          cache-targets: true
          cache-bin: false
          cache-all-crates: true
          lookup-only: ${{ env.CACHE_MODE == 'cold' }}
          # Cold checks availability without downloading an old registry/target.

      - name: Build or validate source-exact Rust device framework
        env:
          RUST_PREBUILT_HIT: ${{ steps.prebuilt.outputs.cache-hit }}
        run: node scripts/ios-dev-ci/ci.cjs rust-prepare


      # No pod install before the lockfile/Pods restore. No simulator or Android generation.
      - name: Generate iOS project only
        working-directory: ExpoLyrics
        run: node ../scripts/ios-dev-ci/ci.cjs time expo-prebuild npx --no-install expo prebuild --clean --platform ios --no-install

      - name: Resolve generated native identity
        id: native
        run: node scripts/ios-dev-ci/ci.cjs keys

      - name: Start native cache timing
        run: node scripts/ios-dev-ci/ci.cjs mark native-cache-restore

      # Generated projects have no committed Podfile.lock. Restore that exact resolver
      # result first, then key installed Pods and download cache by its actual contents.
      - name: Restore generated Podfile.lock
        id: lock
        if: env.CACHE_MODE != 'cold'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ steps.plan.outputs.path-lock }}
          key: ${{ steps.native.outputs.key-lock }}

      - name: Resolve Podfile.lock cache identity
        id: locked
        run: node scripts/ios-dev-ci/ci.cjs keys

      - name: Restore Pods and CocoaPods downloads
        id: pods
        if: env.CACHE_MODE != 'cold' && steps.locked.outputs.has-lock == 'true'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ${{ steps.plan.outputs.path-pods }}
            ${{ steps.plan.outputs.path-cocoapods }}
          key: ${{ steps.locked.outputs.key-pods }}

      - name: Finish native cache timing
        if: always() && steps.plan.outcome == 'success'
        env:
          CI_JOB_STATUS: ${{ job.status }}
        run: node scripts/ios-dev-ci/ci.cjs span native-cache-restore

      - name: Install locked Pods or resolve first lockfile
        working-directory: ExpoLyrics/ios
        run: |
          set -euo pipefail
          if [ -f Podfile.lock ]; then
            node ../../scripts/ios-dev-ci/ci.cjs time pod-install pod install --deployment
          else
            node ../../scripts/ios-dev-ci/ci.cjs time pod-install pod install
          fi

      - name: Resolve final native dependency keys
        id: final
        run: node scripts/ios-dev-ci/ci.cjs keys

      - name: Start compiler cache timing
        run: node scripts/ios-dev-ci/ci.cjs mark compiler-cache-restore

      - name: Restore Debug device DerivedData
        id: derived
        if: env.CACHE_MODE != 'cold'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ steps.plan.outputs.path-derived }}
          key: ${{ steps.final.outputs.key-derived }}

      - name: Restore content-addressed C and C++ compiler cache
        id: ccache
        if: env.CACHE_MODE != 'cold'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ steps.plan.outputs.path-ccache }}
          key: ${{ steps.final.outputs.key-ccache }}
          # Compatible Xcode/SDK/arch/config only. Warm mode still requires exact hit.
          restore-keys: ${{ steps.final.outputs.ccache-prefix }}

      - name: Finish compiler cache timing
        if: always() && steps.plan.outcome == 'success'
        env:
          CI_JOB_STATUS: ${{ job.status }}
        run: node scripts/ios-dev-ci/ci.cjs span compiler-cache-restore

      - name: Compile JS path proof without a listening Metro server
        working-directory: ExpoLyrics
        run: |
          node ../scripts/ios-dev-ci/ci.cjs time js-offline-embed npx --no-install expo export:embed \
            --entry-file node_modules/expo-router/entry.js --platform ios --dev true --minify false \
            --bundle-output "$CI_EVIDENCE_DIR/rust-js-path.jsbundle" \
            --sourcemap-output "$CI_EVIDENCE_DIR/rust-js-path.map" --max-workers 2

      - name: Build and validate Debug arm64 iPhoneOS client
        run: node scripts/ios-dev-ci/ci.cjs time build-and-validate node scripts/ios-dev-ci/ci.cjs build

      - name: Package and verify unsigned IPA contents and modes
        run: node scripts/ios-dev-ci/ci.cjs package

      - name: Start cache publication timing
        run: node scripts/ios-dev-ci/ci.cjs mark cache-save-and-lookup

      - name: Save npm cache
        if: success() && steps.npm.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ steps.plan.outputs.path-npm }}
          key: ${{ steps.plan.outputs.key-npm }}

      - name: Save lock cache
        if: success() && steps.lock.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ steps.plan.outputs.path-lock }}
          key: ${{ steps.native.outputs.key-lock }}

      - name: Save pods cache
        if: success() && steps.pods.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ${{ steps.plan.outputs.path-pods }}
            ${{ steps.plan.outputs.path-cocoapods }}
          key: ${{ steps.final.outputs.key-pods }}

      - name: Save derived cache
        if: success() && steps.derived.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ steps.plan.outputs.path-derived }}
          key: ${{ steps.final.outputs.key-derived }}

      - name: Save ccache cache
        if: success() && steps.ccache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ steps.plan.outputs.path-ccache }}
          key: ${{ steps.final.outputs.key-ccache }}

      - name: Save prebuilt cache
        if: success() && steps.prebuilt.outputs.cache-hit != 'true' && steps.plan.outputs.rust-enabled == 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ steps.plan.outputs.path-prebuilt }}
          key: ${{ steps.plan.outputs.key-prebuilt }}

      - name: Verify exact npm cache publication
        id: verify_npm
        if: success() && env.CACHE_MODE != 'normal'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ steps.plan.outputs.path-npm }}
          key: ${{ steps.plan.outputs.key-npm }}
          lookup-only: true
          fail-on-cache-miss: true

      - name: Verify exact lock cache publication
        id: verify_lock
        if: success() && env.CACHE_MODE != 'normal'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ steps.plan.outputs.path-lock }}
          key: ${{ steps.native.outputs.key-lock }}
          lookup-only: true
          fail-on-cache-miss: true

      - name: Verify exact pods cache publication
        id: verify_pods
        if: success() && env.CACHE_MODE != 'normal'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ${{ steps.plan.outputs.path-pods }}
            ${{ steps.plan.outputs.path-cocoapods }}
          key: ${{ steps.final.outputs.key-pods }}
          lookup-only: true
          fail-on-cache-miss: true

      - name: Verify exact derived cache publication
        id: verify_derived
        if: success() && env.CACHE_MODE != 'normal'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ steps.plan.outputs.path-derived }}
          key: ${{ steps.final.outputs.key-derived }}
          lookup-only: true
          fail-on-cache-miss: true

      - name: Verify exact ccache cache publication
        id: verify_ccache
        if: success() && env.CACHE_MODE != 'normal'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ steps.plan.outputs.path-ccache }}
          key: ${{ steps.final.outputs.key-ccache }}
          lookup-only: true
          fail-on-cache-miss: true

      - name: Verify exact Rust prebuilt publication
        id: verify_prebuilt
        if: success() && env.CACHE_MODE != 'normal' && steps.plan.outputs.rust-enabled == 'true'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ steps.plan.outputs.path-prebuilt }}
          key: ${{ steps.plan.outputs.key-prebuilt }}
          lookup-only: true
          fail-on-cache-miss: true

      - name: Finish cache publication timing
        if: always() && steps.plan.outcome == 'success'
        env:
          CI_JOB_STATUS: ${{ job.status }}
        run: |
          if [ -f "$CI_EVIDENCE_DIR/cache-save-and-lookup.start" ]; then
            node scripts/ios-dev-ci/ci.cjs span cache-save-and-lookup
          fi

      - name: Upload unsigned IPA as an opaque ZIP file
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ExpoLyrics-development-ipa
          path: ${{ steps.plan.outputs.path-ipa }}
          if-no-files-found: error
          compression-level: 0

      - name: Summarize stage timings and cache evidence
        if: always() && steps.plan.outcome == 'success'
        env:
          CI_JOB_STATUS: ${{ job.status }}
          CACHE_RESULTS: >-
            {"npm":{"outcome":"${{ steps.npm.outcome }}","hit":"${{ steps.npm.outputs.cache-hit }}","matched":"${{ steps.npm.outputs.cache-matched-key }}","verified":"${{ steps.verify_npm.outputs.cache-hit }}"},
            "lock":{"outcome":"${{ steps.lock.outcome }}","hit":"${{ steps.lock.outputs.cache-hit }}","matched":"${{ steps.lock.outputs.cache-matched-key }}","verified":"${{ steps.verify_lock.outputs.cache-hit }}"},
            "pods":{"outcome":"${{ steps.pods.outcome }}","hit":"${{ steps.pods.outputs.cache-hit }}","matched":"${{ steps.pods.outputs.cache-matched-key }}","verified":"${{ steps.verify_pods.outputs.cache-hit }}"},
            "derived":{"outcome":"${{ steps.derived.outcome }}","hit":"${{ steps.derived.outputs.cache-hit }}","matched":"${{ steps.derived.outputs.cache-matched-key }}","verified":"${{ steps.verify_derived.outputs.cache-hit }}"},
            "ccache":{"outcome":"${{ steps.ccache.outcome }}","hit":"${{ steps.ccache.outputs.cache-hit }}","matched":"${{ steps.ccache.outputs.cache-matched-key }}","verified":"${{ steps.verify_ccache.outputs.cache-hit }}"},
            "rust":{"verified":"${{ steps.verify_prebuilt.outputs.cache-hit }}","hit":"${{ steps.rust.outputs.cache-hit }}","prebuilt_hit":"${{ steps.prebuilt.outputs.cache-hit }}","enabled":"${{ steps.plan.outputs.rust-enabled }}"}}
        run: node scripts/ios-dev-ci/ci.cjs summary

      - name: Upload CI evidence including failed-stage timings
        if: always() && steps.plan.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ios-development-ci-evidence
          path: ${{ steps.plan.outputs.path-evidence }}
          if-no-files-found: error
          retention-days: 14
