# Builds and checks an unpublished amd64 candidate on an ephemeral runner.
# The release owner publishes manually after free-account playback acceptance.
name: Desktop Bridge Docker candidate

on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - 'DesktopBridge/**'
      - '.github/workflows/docker-image.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-image-${{ github.ref }}
  cancel-in-progress: true

env:
  SPOTIFY_REPOSITORY_REFRESH: ${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  verify-candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Test Spotify resolver
        run: node --test DesktopBridge/test/resolve-spotify-version.test.js

      - name: Build amd64 image for startup verification
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: ./DesktopBridge
          file: ./DesktopBridge/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: kinesync-desktop-bridge:smoke
          build-args: |
            VCS_REF=${{ github.sha }}
            SPOTIFY_REPOSITORY_REFRESH=${{ env.SPOTIFY_REPOSITORY_REFRESH }}

      - name: Verify patched Spotify and adblockify startup
        run: |
          set -euo pipefail
          docker run -d --name spotify-smoke --shm-size=512m kinesync-desktop-bridge:smoke
          trap 'docker rm -fv spotify-smoke >/dev/null' EXIT
          if ! docker exec spotify-smoke node /opt/kinesync/scripts/check-container-adblock.js; then
            docker logs spotify-smoke
            docker exec spotify-smoke bash -c 'tail -n 80 /config/log/{spotify,xpra}.log' || true
            exit 1
          fi
