# Publishes the self-contained Docker Desktop Bridge image and a tiny setup
# bundle for non-developers. The image is amd64-only because Spotify's Linux
# desktop package is amd64-only.
name: Desktop Bridge Docker image

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-image-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/kinesync-desktop-bridge

jobs:
  publish-image:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Read release version
        id: release
        run: |
          version=$(node scripts/release-version.js)
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ steps.release.outputs.version }},enable={{is_default_branch}}
            type=sha,prefix=sha-

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build and push amd64 image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./DesktopBridge
          file: ./DesktopBridge/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VCS_REF=${{ github.sha }}
          cache-from: type=gha,scope=desktop-bridge
          cache-to: type=gha,mode=max,scope=desktop-bridge
          provenance: true
          sbom: true

  publish-setup-bundle:
    name: Publish Docker setup bundle
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: publish-image
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Create setup bundle
        run: |
          set -euo pipefail
          mkdir -p release-bundle
          cp compose.yaml .env.docker.example DOCKER.md scripts/setup-docker.sh scripts/setup-docker.ps1 release-bundle/
          (cd release-bundle && zip -q -r ../kinesync-docker-setup.zip .)
          sha256sum kinesync-docker-setup.zip > kinesync-docker-setup.zip.sha256

      - name: Publish Docker assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash scripts/publish-production-release.sh \
            kinesync-docker-setup.zip \
            kinesync-docker-setup.zip.sha256 \
            release-bundle/compose.yaml \
            release-bundle/.env.docker.example \
            release-bundle/DOCKER.md \
            release-bundle/setup-docker.sh \
            release-bundle/setup-docker.ps1
