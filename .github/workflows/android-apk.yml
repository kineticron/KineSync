# Builds a signed Android APK for every push to main.
#
# The APK is built locally so it can be signed with a persistent Android
# keystore held in repository secrets. The current head of main publishes the
# APK to the shared versioned production release.

name: Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  build-android-apk:
    name: Build signed Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ExpoLyrics/package-lock.json

      - name: Install JS dependencies
        working-directory: ExpoLyrics
        run: npm ci

      - name: Setup Java
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set shared release version
        working-directory: ExpoLyrics
        run: |
          version=$(node ../scripts/release-version.js)
          node scripts/stamp-ios-release-version.js "${version}" "${GITHUB_RUN_NUMBER}"

      - name: Expo prebuild (Android)
        working-directory: ExpoLyrics
        run: npx expo prebuild --clean --platform android

      - name: Configure release signing and version
        working-directory: ExpoLyrics
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              echo "${name} must be configured as a repository secret." >&2
              exit 1
            fi
          done

          key_store_path="${PWD}/android/app/release.keystore"
          printf '%s' "${ANDROID_KEYSTORE_BASE64}" | base64 --decode > "${key_store_path}"
          chmod 600 "${key_store_path}"
          if [[ ! -s "${key_store_path}" ]]; then
            echo "ANDROID_KEYSTORE_BASE64 did not produce a keystore." >&2
            exit 1
          fi
          keytool -list -keystore "${key_store_path}" \
            -storepass "${ANDROID_KEYSTORE_PASSWORD}" \
            -alias "${ANDROID_KEY_ALIAS}" >/dev/null

          # expo prebuild intentionally removes the public debug-key fallback
          # from release builds. Add an explicit CI signing config and connect
          # it to release without committing secrets or generated native code.
          node <<'NODE'
          const fs = require('fs');
          const file = 'android/app/build.gradle';
          let source = fs.readFileSync(file, 'utf8');
          const signingStart = source.indexOf('    signingConfigs {');
          const buildTypesStart = source.indexOf('    buildTypes {', signingStart);
          if (signingStart < 0 || buildTypesStart < 0) {
            throw new Error('Could not locate Android signing/buildTypes blocks');
          }
          const signingBlock = source.slice(signingStart, buildTypesStart);
          if (!signingBlock.includes('signingConfigs.release')) {
            const close = signingBlock.lastIndexOf('    }');
            if (close < 0) throw new Error('Could not locate signingConfigs closing brace');
            const releaseConfig = [
              '        release {',
              '            storeFile file(System.getenv("ANDROID_KEYSTORE_PATH"))',
              '            storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")',
              '            keyAlias System.getenv("ANDROID_KEY_ALIAS")',
              '            keyPassword System.getenv("ANDROID_KEY_PASSWORD")',
              '        }',
              '',
            ].join('\n');
            source = source.slice(0, signingStart) +
              signingBlock.slice(0, close) + releaseConfig +
              signingBlock.slice(close) + source.slice(buildTypesStart);
          }
          // Recalculate this index because adding signingConfigs.release
          // changes the source length.
          const currentBuildTypesStart = source.indexOf('    buildTypes {');
          const releaseStart = source.indexOf('        release {', currentBuildTypesStart);
          if (releaseStart < 0) throw new Error('Could not locate release build type');
          const releaseBodyStart = releaseStart + '        release {'.length;
          if (!source.slice(releaseBodyStart, source.indexOf('\n        }', releaseBodyStart)).includes('signingConfig signingConfigs.release')) {
            source = source.slice(0, releaseBodyStart) +
              '\n            signingConfig signingConfigs.release' +
              source.slice(releaseBodyStart);
          }
          const runNumber = Number(process.env.GITHUB_RUN_NUMBER);
          if (!Number.isSafeInteger(runNumber) || runNumber < 1) throw new Error('Invalid GITHUB_RUN_NUMBER');
          const versionCode = 100000 + runNumber;
          if (versionCode > 2100000000) throw new Error('Android versionCode exceeds platform limit');
          const updated = source.replace(/(\bversionCode\s+)\d+/, `$1${versionCode}`);
          if (updated === source) throw new Error('Could not locate Android versionCode');
          fs.writeFileSync(file, updated);
          console.log(`Configured release signing and Android versionCode ${versionCode}`);
          NODE

          export ANDROID_KEYSTORE_PATH="${key_store_path}"
          # Gradle must run with android/ as its project directory. Calling the
          # wrapper from ExpoLyrics/ alone leaves Gradle looking for settings
          # files in the wrong directory.
          (cd android && ./gradlew --no-daemon --stacktrace assembleRelease)
          cp android/app/build/outputs/apk/release/app-release.apk KineSync-Android.apk
          if [[ ! -s KineSync-Android.apk ]]; then
            echo "Gradle did not produce an APK." >&2
            exit 1
          fi
          # Verify both the ZIP structure and the cryptographic signature.
          unzip -t KineSync-Android.apk >/dev/null
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [[ -z "${sdk_root}" ]]; then
            echo "ANDROID_HOME/ANDROID_SDK_ROOT is not set." >&2
            exit 1
          fi
          apksigner="$(find "${sdk_root}/build-tools" -type f -name apksigner | sort -V | tail -1)"
          if [[ -z "${apksigner}" ]]; then
            echo "Android build-tools apksigner was not found." >&2
            exit 1
          fi
          "${apksigner}" verify --verbose KineSync-Android.apk
          sha256sum KineSync-Android.apk > KineSync-Android.apk.sha256

      - name: Upload APK artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ExpoLyrics-android-apk
          path: |
            ExpoLyrics/KineSync-Android.apk
            ExpoLyrics/KineSync-Android.apk.sha256
          if-no-files-found: error

  publish-android-apk:
    name: Publish Android APK
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-android-apk
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout release metadata
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Download APK artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ExpoLyrics-android-apk
          path: release-assets

      - name: Verify APK artifact
        working-directory: release-assets
        run: |
          set -euo pipefail
          sha256sum --check KineSync-Android.apk.sha256
          unzip -t KineSync-Android.apk >/dev/null

      - name: Publish Android assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash scripts/publish-production-release.sh \
            release-assets/KineSync-Android.apk \
            release-assets/KineSync-Android.apk.sha256
