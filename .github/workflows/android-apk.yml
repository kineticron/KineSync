# Builds a signed Android APK for every push to main.
#
# The APK is built locally so it can be signed with a persistent Android
# keystore held in repository secrets. The current head of main publishes the
# APK to the shared versioned production release.

name: Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      build_variant:
        description: APK type (development uses Metro and preserves release app data)
        type: choice
        default: release
        options:
          - release
          - development
      architecture:
        description: Native architectures (use x86 for the existing BlueStacks instance)
        type: choice
        default: universal
        options:
          - universal
          - x86
          - x86_64
          - arm64-v8a
      cache_mode:
        description: 'normal, cold (skip managed restores and seed), or warm (report managed hits)'
        type: choice
        options: [normal, cold, warm]
        default: normal
      cache_epoch:
        description: 'Same fresh token for both runs of a cold/warm pair'
        type: string
        default: routine

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  build-android-apk:
    name: Build signed Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CACHE_MODE: ${{ inputs.cache_mode || 'normal' }}
      CACHE_EPOCH: ${{ inputs.cache_epoch || 'routine' }}
      RUST_ANDROID_TOOLCHAIN: "1.97.0"
      RUST_ANDROID_PROFILE: release
      KINESYNC_BUILD_KIND: ${{ inputs.build_variant == 'development' && 'development' || 'release' }}
      RELEASE_MARKETING_VERSION: '1.3.0'
      RUST_ANDROID_PLATFORM: "24"
      RUST_ANDROID_CARGO_NDK: "4.1.2"
      RUST_CACHE_WITHIN_BUDGET: 'false'

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Select Android cache namespace
        id: cache_namespace
        continue-on-error: true
        run: |
          set -euo pipefail
          case "$CACHE_MODE" in
            normal) echo "CACHE_EPOCH=routine" >> "$GITHUB_ENV" ;;
            cold|warm)
              if [[ ! "$CACHE_EPOCH" =~ ^[a-zA-Z0-9][a-zA-Z0-9_-]{0,39}$ || "$CACHE_EPOCH" == routine ]]; then
                echo 'Cold and warm runs require an epoch of 1–40 letters, digits, underscores or dashes, starting with a letter or digit and distinct from routine.' >&2
                exit 2
              fi
              ;;
            *) echo 'Unsupported cache mode.' >&2; exit 2 ;;
          esac
          echo "GRADLE_USER_HOME=$RUNNER_TEMP/kinesync-gradle" >> "$GITHUB_ENV"

      - name: Setup Node
        id: node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: ${{ env.CACHE_MODE == 'normal' && 'npm' || '' }}
          cache-dependency-path: ExpoLyrics/package-lock.json

      - name: Install JS dependencies
        working-directory: ExpoLyrics
        run: npm ci

      - name: Setup Java
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android NDK and Rust
        env:
          BUILD_ARCHITECTURE: ${{ inputs.architecture || 'universal' }}
        run: |
          set -euo pipefail
          case "${BUILD_ARCHITECTURE}" in
            universal) abis=armeabi-v7a,arm64-v8a,x86,x86_64 ;;
            arm64-v8a|x86_64|x86) abis="${BUILD_ARCHITECTURE}" ;;
            *) echo "Unsupported Android architecture: ${BUILD_ARCHITECTURE}" >&2; exit 2 ;;
          esac
          echo "RUST_ANDROID_ABIS=${abis}" >> "$GITHUB_ENV"
          # Use the same NDK as the installed React Native Gradle plugin.
          ndk_version=$(node -e 'const fs = require("fs"); const source = fs.readFileSync("ExpoLyrics/node_modules/react-native/gradle/libs.versions.toml", "utf8"); const match = source.match(/^ndkVersion\s*=\s*"([0-9.]+)"/m); if (!match) throw new Error("React Native NDK version not found"); process.stdout.write(match[1]);')
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [[ -z "${sdk_root}" ]]; then
            echo 'ANDROID_HOME/ANDROID_SDK_ROOT is required.' >&2
            exit 1
          fi
          sdkmanager_bin="$(command -v sdkmanager || true)"
          if [[ -z "${sdkmanager_bin}" ]]; then sdkmanager_bin="${sdk_root}/cmdline-tools/latest/bin/sdkmanager"; fi
          "${sdkmanager_bin}" --install "ndk;${ndk_version}"
          ndk_home="${sdk_root}/ndk/${ndk_version}"
          rustup toolchain install "$RUST_ANDROID_TOOLCHAIN" --profile minimal
          {
            echo "ANDROID_NDK_HOME=$ndk_home"
            echo "CARGO_HOME=$RUNNER_TEMP/kinesync-android-cargo"
            echo "CARGO_TARGET_DIR=$GITHUB_WORKSPACE/native/lyrics-renderer/target"
            echo "KINESYNC_ORIGINAL_INCREMENTAL=${CARGO_INCREMENTAL:-}"
          } >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/kinesync-android-cargo/bin" >> "$GITHUB_PATH"

      - name: Identify Android Rust caches
        id: native
        if: steps.cache_namespace.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          ndk_identity=$( (cat "$ANDROID_NDK_HOME/source.properties" && "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/clang" --version) | sha256sum | cut -d' ' -f1 )
          rust_host=$(rustc "+$RUST_ANDROID_TOOLCHAIN" -vV | sha256sum | cut -d' ' -f1)
          rust_inputs=$(sha256sum scripts/build-rust-lyrics-android.sh | cut -d' ' -f1)
          echo "rust_prefix=android-rust-v1-${CACHE_EPOCH}-${rust_inputs}" >> "$GITHUB_OUTPUT"
          echo "RUST_ANDROID_NDK_ID=$ndk_identity" >> "$GITHUB_ENV"
          echo "key=cargo-ndk-v1-${RUNNER_OS}-${RUNNER_ARCH}-${CACHE_EPOCH}-${RUST_ANDROID_CARGO_NDK}-${rust_host}" >> "$GITHUB_OUTPUT"

      - name: Restore cargo-ndk binaries
        id: ndk_bin
        if: env.CACHE_MODE != 'cold' && steps.native.outcome == 'success' && steps.native.outputs.key != ''
        continue-on-error: true
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/kinesync-android-cargo/bin/cargo-ndk*
          key: ${{ steps.native.outputs.key }}

      - name: Clear incomplete cargo-ndk restore
        if: steps.ndk_bin.outcome != 'skipped' && (steps.ndk_bin.outcome != 'success' || steps.ndk_bin.outputs.cache-matched-key == '')
        run: rm -f -- "$CARGO_HOME"/bin/cargo-ndk*

      - name: Install or verify cargo-ndk
        run: |
          set -euo pipefail
          install_root="$CARGO_HOME"
          if [[ ! -x "$install_root/bin/cargo-ndk" || ! -x "$install_root/bin/cargo-ndk-env" || ! -x "$install_root/bin/cargo-ndk-test" ]] ||
             [[ $(cargo "+$RUST_ANDROID_TOOLCHAIN" ndk --version) != "cargo-ndk $RUST_ANDROID_CARGO_NDK" ]]; then
            env -u CARGO_TARGET_DIR CARGO_HOME="$RUNNER_TEMP/kinesync-cargo-ndk-install" \
              cargo "+$RUST_ANDROID_TOOLCHAIN" install cargo-ndk --version "$RUST_ANDROID_CARGO_NDK" --locked --root "$install_root" --force
          fi
          version=$(cargo "+$RUST_ANDROID_TOOLCHAIN" ndk --version)
          [[ "$version" == "cargo-ndk $RUST_ANDROID_CARGO_NDK" ]]
          echo "$version"

      - name: Cache Android Rust dependencies and target work
        id: rust
        if: steps.native.outcome == 'success' && steps.native.outputs.key != ''
        continue-on-error: true
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        env:
          RUSTUP_TOOLCHAIN: ${{ env.RUST_ANDROID_TOOLCHAIN }}
        with:
          prefix-key: ${{ steps.native.outputs.rust_prefix }}
          workspaces: native/lyrics-renderer -> target
          env-vars: ANDROID_NDK_HOME ANDROID_NDK_ROOT ANDROID_NDK_VERSION ANDROID_PLATFORM AR ARFLAGS CPPFLAGS LDFLAGS KINESYNC_ORIGINAL_INCREMENTAL
          cache-targets: true
          cache-all-crates: true
          cache-workspace-crates: true
          cache-bin: false
          cache-on-failure: false
          # The runner evaluates action inputs again for the success-only post.
          save-if: ${{ env.RUST_CACHE_WITHIN_BUDGET == 'true' }}
          # Lookup can find an existing immutable entry without downloading it.
          lookup-only: ${{ env.CACHE_MODE == 'cold' }}

      - name: Clear unconfirmed Android Rust restore
        if: env.CACHE_MODE != 'cold' && steps.rust.outcome != 'skipped' && (steps.rust.outcome != 'success' || steps.rust.outputs.cache-hit != 'true')
        run: rm -rf -- "${CARGO_TARGET_DIR:?}" "${CARGO_HOME:?}/registry" "$CARGO_HOME/git"

      - name: Build Android Rust static libraries
        run: |
          if [[ -n "$KINESYNC_ORIGINAL_INCREMENTAL" ]]; then
            export CARGO_INCREMENTAL="$KINESYNC_ORIGINAL_INCREMENTAL"
          else
            unset CARGO_INCREMENTAL
          fi
          bash scripts/build-rust-lyrics-android.sh "${RUST_ANDROID_ABIS}"

      - name: Set shared release version
        working-directory: ExpoLyrics
        run: |
          version=$(node ../scripts/release-version.js "$RELEASE_MARKETING_VERSION")
          node scripts/stamp-ios-release-version.js "${version}" "${GITHUB_RUN_NUMBER}"

      - name: Expo prebuild (Android)
        working-directory: ExpoLyrics
        run: npx expo prebuild --clean --platform android

      - name: Setup Gradle
        continue-on-error: true
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          # Use explicit success-only saves after APK verification and upload.
          cache-provider: external
          validate-wrappers: false

      - name: Identify Gradle downloads
        id: gradle_key
        if: steps.native.outcome == 'success' && env.GRADLE_USER_HOME != ''
        continue-on-error: true
        run: |
          set -euo pipefail
          wrapper=$(sha256sum ExpoLyrics/android/gradle/wrapper/* | sha256sum | cut -d' ' -f1)
          dependencies=$(
            {
              git ls-files -z -- ExpoLyrics/package-lock.json ExpoLyrics/patches |
                xargs -0 sha256sum &&
              find ExpoLyrics/android -type f \( -name 'settings.gradle*' -o -name 'build.gradle*' -o -name gradle.properties -o -name libs.versions.toml \) -print0 |
                sort -z | xargs -0 sha256sum
            } | sha256sum | cut -d' ' -f1
          )
          java_identity=$(java -version 2>&1 | sha256sum | cut -d' ' -f1)
          prefix="android-gradle-downloads-v2-${RUNNER_OS}-${RUNNER_ARCH}-${CACHE_EPOCH}-${java_identity}-${RUST_ANDROID_NDK_ID}-${wrapper}-"
          echo "prefix=$prefix" >> "$GITHUB_OUTPUT"
          echo "key=${prefix}${dependencies}" >> "$GITHUB_OUTPUT"

      - name: Restore Gradle downloads
        id: gradle
        if: env.CACHE_MODE != 'cold' && steps.gradle_key.outcome == 'success' && steps.gradle_key.outputs.key != ''
        continue-on-error: true
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ${{ env.GRADLE_USER_HOME }}/caches/modules-2
            ${{ env.GRADLE_USER_HOME }}/wrapper/dists
          key: ${{ steps.gradle_key.outputs.key }}
          restore-keys: ${{ steps.gradle_key.outputs.prefix }}

      - name: Clear incomplete Gradle restore
        if: steps.gradle.outcome != 'skipped' && (steps.gradle.outcome != 'success' || steps.gradle.outputs.cache-matched-key == '')
        run: rm -rf -- "${GRADLE_USER_HOME:?}/caches/modules-2" "$GRADLE_USER_HOME/wrapper/dists"

      - name: Configure release signing and version
        working-directory: ExpoLyrics
        env:
          BUILD_VARIANT: ${{ inputs.build_variant || 'release' }}
          BUILD_ARCHITECTURE: ${{ inputs.architecture || 'universal' }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              echo "${name} must be configured as a repository secret." >&2
              exit 1
            fi
          done

          key_store_path="${PWD}/android/app/release.keystore"
          printf '%s' "${ANDROID_KEYSTORE_BASE64}" | base64 --decode > "${key_store_path}"
          chmod 600 "${key_store_path}"
          if [[ ! -s "${key_store_path}" ]]; then
            echo "ANDROID_KEYSTORE_BASE64 did not produce a keystore." >&2
            exit 1
          fi
          keytool -list -keystore "${key_store_path}" \
            -storepass "${ANDROID_KEYSTORE_PASSWORD}" \
            -alias "${ANDROID_KEY_ALIAS}" >/dev/null

          # expo prebuild intentionally removes the public debug-key fallback
          # from release builds. Add an explicit CI signing config and connect
          # it to release without committing secrets or generated native code.
          node <<'NODE'
          const fs = require('fs');
          const file = 'android/app/build.gradle';
          let source = fs.readFileSync(file, 'utf8');
          const signingStart = source.indexOf('    signingConfigs {');
          const buildTypesStart = source.indexOf('    buildTypes {', signingStart);
          if (signingStart < 0 || buildTypesStart < 0) {
            throw new Error('Could not locate Android signing/buildTypes blocks');
          }
          const signingBlock = source.slice(signingStart, buildTypesStart);
          if (!signingBlock.includes('signingConfigs.release')) {
            const close = signingBlock.lastIndexOf('    }');
            if (close < 0) throw new Error('Could not locate signingConfigs closing brace');
            const releaseConfig = [
              '        release {',
              '            storeFile file(System.getenv("ANDROID_KEYSTORE_PATH"))',
              '            storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")',
              '            keyAlias System.getenv("ANDROID_KEY_ALIAS")',
              '            keyPassword System.getenv("ANDROID_KEY_PASSWORD")',
              '        }',
              '',
            ].join('\n');
            source = source.slice(0, signingStart) +
              signingBlock.slice(0, close) + releaseConfig +
              signingBlock.slice(close) + source.slice(buildTypesStart);
          }
          // Recalculate this index because adding signingConfigs.release
          // changes the source length.
          const currentBuildTypesStart = source.indexOf('    buildTypes {');
          const releaseStart = source.indexOf('        release {', currentBuildTypesStart);
          if (releaseStart < 0) throw new Error('Could not locate release build type');
          const releaseBodyStart = releaseStart + '        release {'.length;
          if (!source.slice(releaseBodyStart, source.indexOf('\n        }', releaseBodyStart)).includes('signingConfig signingConfigs.release')) {
            source = source.slice(0, releaseBodyStart) +
              '\n            signingConfig signingConfigs.release' +
              source.slice(releaseBodyStart);
          }
          // Sign the development client with the same certificate/package so
          // adb install -r can preserve existing Spotify cookies and settings.
          if (process.env.BUILD_VARIANT === 'development') {
            const debugStart = source.indexOf('        debug {', currentBuildTypesStart);
            const debugEnd = source.indexOf('\n        }', debugStart);
            if (debugStart < 0 || debugEnd < 0) throw new Error('Could not locate debug build type');
            const debugBlock = source.slice(debugStart, debugEnd);
            if (!debugBlock.includes('signingConfig signingConfigs.debug')) throw new Error('Unexpected debug signing configuration');
            source = source.slice(0, debugStart) + debugBlock.replace('signingConfig signingConfigs.debug', 'signingConfig signingConfigs.release') + source.slice(debugEnd);
          }
          const runNumber = Number(process.env.GITHUB_RUN_NUMBER);
          if (!/^[1-9]\d*$/.test(process.env.GITHUB_RUN_NUMBER) || !Number.isSafeInteger(runNumber)) {
            throw new Error('Invalid GITHUB_RUN_NUMBER');
          }
          const versionName = process.env.RELEASE_MARKETING_VERSION;
          const generatedName = source.match(/^\s*versionName\s+"([^"]+)"\s*$/m)?.[1];
          if (generatedName !== versionName) {
            throw new Error(`Expected prebuild Android versionName ${versionName}, found ${generatedName}`);
          }
          const versionCode = 100000 + runNumber;
          if (versionCode > 2100000000) throw new Error('Android versionCode exceeds platform limit');
          const versionCodeLine = /^(\s*versionCode\s+)\d+(\s*)$/m;
          if (!versionCodeLine.test(source)) throw new Error('Could not locate Android versionCode');
          const updated = source.replace(versionCodeLine, (_, prefix, suffix) => `${prefix}${versionCode}${suffix}`);
          fs.writeFileSync(file, updated);
          console.log(`Configured Android versionName ${versionName} and versionCode ${versionCode}`);
          NODE

          export ANDROID_KEYSTORE_PATH="${key_store_path}"
          # Gradle must run with android/ as its project directory. Calling the
          # wrapper from ExpoLyrics/ alone leaves Gradle looking for settings
          # files in the wrong directory.
          # Packaging the universal APK needs more than Expo's default 2 GB heap.
          # Limit workers so native compilation leaves memory for the JVM.
          if [[ "${BUILD_VARIANT}" == "development" ]]; then
            gradle_task=assembleDebug
            apk_path=android/app/build/outputs/apk/debug/app-debug.apk
          else
            gradle_task=assembleRelease
            apk_path=android/app/build/outputs/apk/release/app-release.apk
          fi
          # Keep Gradle's ABI set identical to the archives built above.
          architecture_args=("-PreactNativeArchitectures=${RUST_ANDROID_ABIS}")
          (cd android && ./gradlew --no-daemon --stacktrace --max-workers=2 \
            '-Dorg.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g' "${architecture_args[@]}" "${gradle_task}")
          cp "${apk_path}" KineSync-Android.apk
          if [[ ! -s KineSync-Android.apk ]]; then
            echo "Gradle did not produce an APK." >&2
            exit 1
          fi
          # Verify both the ZIP structure and the cryptographic signature.
          unzip -t KineSync-Android.apk >/dev/null
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [[ -z "${sdk_root}" ]]; then
            echo "ANDROID_HOME/ANDROID_SDK_ROOT is not set." >&2
            exit 1
          fi
          apksigner="$(find "${sdk_root}/build-tools" -type f -name apksigner | sort -V | tail -1)"
          if [[ -z "${apksigner}" ]]; then
            echo "Android build-tools apksigner was not found." >&2
            exit 1
          fi
          "${apksigner}" verify --verbose KineSync-Android.apk
          aapt="$(dirname "${apksigner}")/aapt"
          badging=$("${aapt}" dump badging KineSync-Android.apk)
          package_badging=$(sed -n '/^package: /{p;q;}' <<< "${badging}")
          expected_code=$((100000 + GITHUB_RUN_NUMBER))
          if [[ "${package_badging}" != *" versionName='${RELEASE_MARKETING_VERSION}'"* ||
                "${package_badging}" != *" versionCode='${expected_code}'"* ]]; then
            echo "Unexpected APK version metadata: ${package_badging}" >&2
            exit 1
          fi
          echo "${package_badging}"
          if [[ "${BUILD_VARIANT}" == "release" ]]; then
            node ../scripts/check-release-diagnostics.cjs android KineSync-Android.apk
          fi
          sha256sum KineSync-Android.apk > KineSync-Android.apk.sha256

      - name: Upload APK artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ inputs.build_variant == 'development' && 'ExpoLyrics-android-development-apk' || 'ExpoLyrics-android-apk' }}
          path: |
            ExpoLyrics/KineSync-Android.apk
            ExpoLyrics/KineSync-Android.apk.sha256
          if-no-files-found: error

      - name: Bound Android Rust and cargo-ndk caches
        id: native_cache_size
        if: success()
        continue-on-error: true
        env:
          RUST_CACHE_RESTORED: ${{ steps.rust.outcome }}
        run: |
          set -euo pipefail
          kib=0
          for path in "$CARGO_TARGET_DIR" "$CARGO_HOME/registry" "$CARGO_HOME/git"; do
            if [[ -d "$path" ]]; then
              size=$(du -sk "$path" | cut -f1)
              kib=$(( kib + size ))
            fi
          done
          echo "Android Rust files before Rust Cache pruning: $kib KiB (save limit: 2621440 KiB)"
          rust_kib=$kib
          kib=$(du -sk "$CARGO_HOME"/bin/cargo-ndk* | awk '{sum += $1} END {print sum+0}')
          echo "cargo-ndk binaries: $kib KiB (save limit: 65536 KiB)"
          if (( kib <= 65536 )); then echo 'ndk=true' >> "$GITHUB_OUTPUT"; fi
          if [[ "$RUST_CACHE_RESTORED" == success ]] && (( rust_kib <= 2621440 )); then echo 'RUST_CACHE_WITHIN_BUDGET=true' >> "$GITHUB_ENV"; fi

      - name: Save cargo-ndk binaries
        id: save_ndk
        if: success() && steps.native_cache_size.outcome == 'success' && steps.native.outputs.key != '' && steps.native_cache_size.outputs.ndk == 'true' && steps.ndk_bin.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/kinesync-android-cargo/bin/cargo-ndk*
          key: ${{ steps.native.outputs.key }}

      - name: Bound Gradle download cache
        id: gradle_size
        continue-on-error: true
        if: success() && steps.gradle_key.outputs.key != '' && steps.gradle.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          paths=()
          for relative in caches/modules-2 wrapper/dists; do
            target="$GRADLE_USER_HOME/$relative"
            [[ -d "$target" ]] || continue
            find "$target" -type f \( -name '*.lock' -o -name '*.lck' -o -name gc.properties \) -delete
            paths+=("$target")
          done
          if (( ${#paths[@]} == 0 )); then exit 0; fi
          kib=$(du -sk "${paths[@]}" | awk '{sum += $1} END {print sum+0}')
          echo "Gradle downloads: $kib KiB (save limit: 1048576 KiB)"
          if (( kib <= 1048576 )); then echo 'within-budget=true' >> "$GITHUB_OUTPUT"; fi

      - name: Save Gradle downloads
        id: save_gradle
        if: success() && steps.gradle_size.outcome == 'success' && steps.gradle_key.outputs.key != '' && steps.gradle_size.outputs.within-budget == 'true'
        continue-on-error: true
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ${{ env.GRADLE_USER_HOME }}/caches/modules-2
            ${{ env.GRADLE_USER_HOME }}/wrapper/dists
          key: ${{ steps.gradle_key.outputs.key }}

      - name: Summarize Android cache evidence
        continue-on-error: true
        if: always()
        env:
          NPM_HIT: ${{ steps.node.outputs.cache-hit }}
          RUST_HIT: ${{ steps.rust.outputs.cache-hit }}
          NDK_HIT: ${{ steps.ndk_bin.outputs.cache-hit }}
          GRADLE_HIT: ${{ steps.gradle.outputs.cache-hit }}
          GRADLE_MATCHED: ${{ steps.gradle.outputs.cache-matched-key }}
          NDK_SAVE: ${{ steps.save_ndk.outcome }}
          GRADLE_SAVE: ${{ steps.save_gradle.outcome }}
        run: |
          if [[ "$CACHE_MODE" == cold ]]; then
            rust="skipped transfer (lookup exact hit: ${RUST_HIT:-unknown})"
            ndk=skipped
            gradle=skipped
          else
            rust="exact hit: ${RUST_HIT:-unknown}"
            ndk="exact hit: ${NDK_HIT:-miss or unavailable}"
            gradle="exact hit: ${GRADLE_HIT:-miss or unavailable}. Matched key: ${GRADLE_MATCHED:-none}"
          fi
          {
            echo '### Android cache evidence'
            printf 'Mode: %s | Epoch: %s | ABI set: %s\n\n' "$CACHE_MODE" "$CACHE_EPOCH" "${RUST_ANDROID_ABIS:-unavailable}"
            echo '| Cache | Restore evidence | Save step |'
            echo '| --- | --- | --- |'
            printf '| npm | %s | setup-node post step in normal mode |\n' "${NPM_HIT:-unavailable or disabled}"
            printf '| Rust registry and targets | %s | within size budget: %s. See Rust cache post step |\n' "$rust" "$RUST_CACHE_WITHIN_BUDGET"
            printf '| cargo-ndk binaries | %s | %s |\n' "$ndk" "${NDK_SAVE:-unavailable}"
            printf '| Gradle downloads | %s | %s |\n' "$gradle" "${GRADLE_SAVE:-unavailable}"
          } | tee -a "$GITHUB_STEP_SUMMARY"

  publish-android-apk:
    name: Publish Android APK
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-android-apk
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout release metadata
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Download APK artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ExpoLyrics-android-apk
          path: release-assets

      - name: Verify APK artifact
        working-directory: release-assets
        run: |
          set -euo pipefail
          sha256sum --check KineSync-Android.apk.sha256
          unzip -t KineSync-Android.apk >/dev/null

      - name: Publish Android assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash scripts/publish-production-release.sh \
            release-assets/KineSync-Android.apk \
            release-assets/KineSync-Android.apk.sha256
