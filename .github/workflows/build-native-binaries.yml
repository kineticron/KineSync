# Builds the Windows Desktop release and publishes it with the other production
# assets from main.
# Artifacts: Windows installer, windows_media_session.node, spotify-seek-helper.dll,
#             spotify-seek-helper.runtimeconfig.json,
#             Microsoft.Windows.SDK.NET.dll, WinRT.Runtime.dll
#
# The DesktopBridge postinstall downloader consumes these assets from the shared
# v* release.

name: Build Windows desktop release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-native-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: DesktopBridge/package-lock.json

      - name: Setup .NET 9
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "9.0.x"

      - name: Install root DesktopBridge deps
        working-directory: DesktopBridge
        # Skip only KineSync's native downloader. Dependency install scripts
        # must run because electron-winstaller selects its host 7-Zip binary.
        env:
          SKIP_POSTINSTALL: "1"
        run: npm ci --audit=false --fund=false

      - name: Verify Squirrel packaging helpers
        working-directory: DesktopBridge
        run: |
          set -euo pipefail
          test -f node_modules/electron-winstaller/vendor/7z.exe
          test -f node_modules/electron-winstaller/vendor/7z.dll
          test -f node_modules/electron-winstaller/vendor/Squirrel.exe

      - name: Build C++ media-session addon
        working-directory: DesktopBridge
        run: npm run build:native-media

      - name: Build .NET seek helper
        working-directory: DesktopBridge
        run: npm run build:seek-helper

      - name: Prepare optional Windows signing certificate
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_PFX_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_PFX_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $hasPfx = ![string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_PFX_BASE64)
          $hasPassword = ![string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_PASSWORD)
          if (!$hasPfx -and !$hasPassword) {
            Write-Host 'No Windows signing secrets configured; producing an unsigned installer.'
            exit 0
          }
          if (!$hasPfx -or !$hasPassword) {
            throw 'Both WINDOWS_CERTIFICATE_PFX_BASE64 and WINDOWS_CERTIFICATE_PASSWORD must be configured together.'
          }
          try {
            $bytes = [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_PFX_BASE64)
          } catch {
            throw 'WINDOWS_CERTIFICATE_PFX_BASE64 is not valid base64.'
          }
          if ($bytes.Length -lt 1) { throw 'Windows signing certificate is empty.' }
          $pfxPath = Join-Path $env:RUNNER_TEMP 'kinesync-windows-signing.pfx'
          [IO.File]::WriteAllBytes($pfxPath, $bytes)
          "WINDOWS_CERTIFICATE_FILE=$pfxPath" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "WINDOWS_CERTIFICATE_PASSWORD=$env:WINDOWS_CERTIFICATE_PASSWORD" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host 'Windows signing certificate prepared for Forge.'

      - name: Build Windows installer
        working-directory: DesktopBridge
        # Native builds above must complete first: Forge packages the native
        # addon and seek helper into the application payload.
        run: npm run make:windows

      - name: Collect artifacts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path dist-native | Out-Null
          Copy-Item DesktopBridge/native/windows-media-session/build/Release/windows_media_session.node dist-native/ -ErrorAction Stop
          $seekOut = "DesktopBridge/native/spotify-seek-helper/bin/Release/net9.0-windows10.0.19041.0"
          Copy-Item "$seekOut/spotify-seek-helper.dll" dist-native/ -ErrorAction Stop
          Copy-Item "$seekOut/spotify-seek-helper.runtimeconfig.json" dist-native/ -ErrorAction Stop
          Copy-Item "$seekOut/Microsoft.Windows.SDK.NET.dll" dist-native/ -ErrorAction Stop
          Copy-Item "$seekOut/WinRT.Runtime.dll" dist-native/ -ErrorAction Stop

          $expected = @(
            'windows_media_session.node',
            'spotify-seek-helper.dll',
            'spotify-seek-helper.runtimeconfig.json',
            'Microsoft.Windows.SDK.NET.dll',
            'WinRT.Runtime.dll'
          )
          foreach ($name in $expected) {
            $file = Join-Path dist-native $name
            if (!(Test-Path -LiteralPath $file -PathType Leaf)) {
              throw "Missing native artifact: $file"
            }
          }

          $installers = @(Get-ChildItem -Path DesktopBridge/out/make -Recurse -File -Filter 'KineSync-Desktop-Windows-Setup.exe')
          if ($installers.Count -ne 1) {
            throw "Expected exactly one KineSync-Desktop-Windows-Setup.exe under DesktopBridge/out/make; found $($installers.Count)."
          }
          if ($installers[0].Length -le 0) {
            throw "Windows installer is empty: $($installers[0].FullName)"
          }
          Copy-Item -LiteralPath $installers[0].FullName -Destination dist-native/ -ErrorAction Stop
          $installerPath = Join-Path dist-native 'KineSync-Desktop-Windows-Setup.exe'
          $installerHash = (Get-FileHash -LiteralPath $installerPath -Algorithm SHA256).Hash.ToLowerInvariant()
          "$installerHash  KineSync-Desktop-Windows-Setup.exe" | Set-Content -LiteralPath (Join-Path dist-native 'KineSync-Desktop-Windows-Setup.exe.sha256') -Encoding ascii

      - name: Create versioned SHA-256 manifest
        working-directory: DesktopBridge
        run: |
          version=$(node ../scripts/release-version.js)
          node scripts/create-native-manifest.js "${version}" ../dist-native

      - name: Upload native artifacts for publisher
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-release-assets
          path: dist-native
          if-no-files-found: error

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout release publisher
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download native artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: native-release-assets
          path: dist-native

      - name: Publish Windows assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash scripts/publish-production-release.sh dist-native/*
