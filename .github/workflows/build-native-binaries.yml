# Builds the Windows Desktop release and publishes it with the other production
# assets from main.
# Artifacts: Windows installer, windows_media_session.node, spotify-seek-helper.dll,
#             spotify-seek-helper.runtimeconfig.json,
#             Microsoft.Windows.SDK.NET.dll, WinRT.Runtime.dll
#
# The DesktopBridge postinstall downloader consumes these assets from the shared
# v* release.

name: Build Windows desktop release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-native-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Node
        id: node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: DesktopBridge/package-lock.json

      - name: Setup .NET 9
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: "9.0.x"

      - name: Identify Windows native downloads
        id: downloads_key
        continue-on-error: true
        shell: pwsh
        env:
          NODE_VERSION: ${{ steps.node.outputs.node-version }}
        run: |
          $nuget = Join-Path $env:RUNNER_TEMP 'kinesync-nuget-packages'
          $electron = Join-Path $env:LOCALAPPDATA 'electron/Cache'
          $nodeGyp = Join-Path $env:LOCALAPPDATA 'node-gyp/Cache'
          $dotnetVersion = dotnet --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $dependencies = git rev-parse HEAD:DesktopBridge/package-lock.json HEAD:DesktopBridge/native/windows-media-session/package-lock.json HEAD:DesktopBridge/native/windows-media-session/rebuild-electron.cjs HEAD:DesktopBridge/native/spotify-seek-helper/spotify-seek-helper.csproj
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (!$dotnetVersion -or !$env:NODE_VERSION -or !$dependencies) { throw 'Windows download key inputs are missing.' }
          $prefix = "windows-native-downloads-v1-$env:RUNNER_OS-$env:RUNNER_ARCH-$env:NODE_VERSION-$dotnetVersion-"
          "NUGET_PACKAGES=$nuget" >> $env:GITHUB_ENV
          "electron=$electron" >> $env:GITHUB_OUTPUT
          "node_gyp=$nodeGyp" >> $env:GITHUB_OUTPUT
          "prefix=$prefix" >> $env:GITHUB_OUTPUT
          "key=${prefix}$($dependencies -join "-")" >> $env:GITHUB_OUTPUT

      - name: Restore Windows native downloads
        id: downloads
        if: steps.downloads_key.outcome == 'success' && steps.downloads_key.outputs.key != ''
        continue-on-error: true
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ${{ env.NUGET_PACKAGES }}
            ${{ steps.downloads_key.outputs.electron }}
            ${{ steps.downloads_key.outputs.node_gyp }}
          key: ${{ steps.downloads_key.outputs.key }}
          restore-keys: ${{ steps.downloads_key.outputs.prefix }}

      - name: Clear incomplete Windows download restore
        if: steps.downloads.outcome != 'skipped' && (steps.downloads.outcome != 'success' || steps.downloads.outputs.cache-matched-key == '')
        shell: pwsh
        env:
          ELECTRON_DOWNLOADS: ${{ steps.downloads_key.outputs.electron }}
          NODE_GYP_DOWNLOADS: ${{ steps.downloads_key.outputs.node_gyp }}
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($path in @($env:NUGET_PACKAGES, $env:ELECTRON_DOWNLOADS, $env:NODE_GYP_DOWNLOADS)) {
            if ([string]::IsNullOrWhiteSpace($path)) { throw 'Missing Windows download path for cleanup.' }
            if (Test-Path -LiteralPath $path) {
              Remove-Item -LiteralPath $path -Recurse -Force -ErrorAction Stop
            }
          }

      - name: Install root DesktopBridge deps
        working-directory: DesktopBridge
        # Skip only KineSync's native downloader. Dependency install scripts
        # must run because electron-winstaller selects its host 7-Zip binary.
        env:
          SKIP_POSTINSTALL: "1"
        run: npm ci --audit=false --fund=false

      - name: Verify Squirrel packaging helpers
        working-directory: DesktopBridge
        run: |
          set -euo pipefail
          test -f node_modules/electron-winstaller/vendor/7z.exe
          test -f node_modules/electron-winstaller/vendor/7z.dll
          test -f node_modules/electron-winstaller/vendor/Squirrel.exe

      - name: Build C++ media-session addon
        working-directory: DesktopBridge
        run: npm run build:native-media

      - name: Build .NET seek helper
        working-directory: DesktopBridge
        run: npm run build:seek-helper

      - name: Prepare optional Windows signing certificate
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_PFX_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_PFX_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $hasPfx = ![string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_PFX_BASE64)
          $hasPassword = ![string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_PASSWORD)
          if (!$hasPfx -and !$hasPassword) {
            Write-Host 'No Windows signing secrets configured; producing an unsigned installer.'
            exit 0
          }
          if (!$hasPfx -or !$hasPassword) {
            throw 'Both WINDOWS_CERTIFICATE_PFX_BASE64 and WINDOWS_CERTIFICATE_PASSWORD must be configured together.'
          }
          try {
            $bytes = [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_PFX_BASE64)
          } catch {
            throw 'WINDOWS_CERTIFICATE_PFX_BASE64 is not valid base64.'
          }
          if ($bytes.Length -lt 1) { throw 'Windows signing certificate is empty.' }
          $pfxPath = Join-Path $env:RUNNER_TEMP 'kinesync-windows-signing.pfx'
          [IO.File]::WriteAllBytes($pfxPath, $bytes)
          "WINDOWS_CERTIFICATE_FILE=$pfxPath" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "WINDOWS_CERTIFICATE_PASSWORD=$env:WINDOWS_CERTIFICATE_PASSWORD" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host 'Windows signing certificate prepared for Forge.'

      - name: Build Windows installer
        working-directory: DesktopBridge
        # Native builds above must complete first: Forge packages the native
        # addon and seek helper into the application payload.
        run: npm run make:windows

      - name: Collect artifacts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path dist-native | Out-Null
          Copy-Item DesktopBridge/native/windows-media-session/build/Release/windows_media_session.node dist-native/ -ErrorAction Stop
          $seekOut = "DesktopBridge/native/spotify-seek-helper/bin/Release/net9.0-windows10.0.19041.0"
          Copy-Item "$seekOut/spotify-seek-helper.dll" dist-native/ -ErrorAction Stop
          Copy-Item "$seekOut/spotify-seek-helper.runtimeconfig.json" dist-native/ -ErrorAction Stop
          Copy-Item "$seekOut/Microsoft.Windows.SDK.NET.dll" dist-native/ -ErrorAction Stop
          Copy-Item "$seekOut/WinRT.Runtime.dll" dist-native/ -ErrorAction Stop

          $expected = @(
            'windows_media_session.node',
            'spotify-seek-helper.dll',
            'spotify-seek-helper.runtimeconfig.json',
            'Microsoft.Windows.SDK.NET.dll',
            'WinRT.Runtime.dll'
          )
          foreach ($name in $expected) {
            $file = Join-Path dist-native $name
            if (!(Test-Path -LiteralPath $file -PathType Leaf)) {
              throw "Missing native artifact: $file"
            }
          }

          $installers = @(Get-ChildItem -Path DesktopBridge/out/make -Recurse -File -Filter 'KineSync-Desktop-Windows-Setup.exe')
          if ($installers.Count -ne 1) {
            throw "Expected exactly one KineSync-Desktop-Windows-Setup.exe under DesktopBridge/out/make; found $($installers.Count)."
          }
          if ($installers[0].Length -le 0) {
            throw "Windows installer is empty: $($installers[0].FullName)"
          }
          Copy-Item -LiteralPath $installers[0].FullName -Destination dist-native/ -ErrorAction Stop
          $installerPath = Join-Path dist-native 'KineSync-Desktop-Windows-Setup.exe'
          $installerHash = (Get-FileHash -LiteralPath $installerPath -Algorithm SHA256).Hash.ToLowerInvariant()
          "$installerHash  KineSync-Desktop-Windows-Setup.exe" | Set-Content -LiteralPath (Join-Path dist-native 'KineSync-Desktop-Windows-Setup.exe.sha256') -Encoding ascii

      - name: Create versioned SHA-256 manifest
        working-directory: DesktopBridge
        run: |
          version=$(node ../scripts/release-version.js)
          node scripts/create-native-manifest.js "${version}" ../dist-native

      - name: Upload native artifacts for publisher
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-release-assets
          path: dist-native
          if-no-files-found: error

      - name: Bound Windows native download cache
        id: downloads_size
        continue-on-error: true
        if: success() && steps.downloads_key.outputs.key != '' && steps.downloads.outputs.cache-hit != 'true'
        shell: pwsh
        env:
          ELECTRON_DOWNLOADS: ${{ steps.downloads_key.outputs.electron }}
          NODE_GYP_DOWNLOADS: ${{ steps.downloads_key.outputs.node_gyp }}
        run: |
          $bytes = 0
          foreach ($path in @($env:NUGET_PACKAGES, $env:ELECTRON_DOWNLOADS, $env:NODE_GYP_DOWNLOADS)) {
            if (Test-Path -LiteralPath $path -PathType Container) {
              $bytes += (Get-ChildItem -LiteralPath $path -Recurse -Force -File | Measure-Object -Property Length -Sum).Sum
            }
          }
          Write-Host "Windows native downloads: $bytes bytes (save limit: 768 MiB)"
          if ($bytes -gt 0 -and $bytes -le 768MB) {
            'within-budget=true' >> $env:GITHUB_OUTPUT
          }

      - name: Save Windows native downloads
        id: save_downloads
        if: success() && steps.downloads_size.outcome == 'success' && steps.downloads_key.outputs.key != '' && steps.downloads_size.outputs.within-budget == 'true'
        continue-on-error: true
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ${{ env.NUGET_PACKAGES }}
            ${{ steps.downloads_key.outputs.electron }}
            ${{ steps.downloads_key.outputs.node_gyp }}
          key: ${{ steps.downloads_key.outputs.key }}

      - name: Summarize Windows cache evidence
        continue-on-error: true
        if: always()
        shell: pwsh
        env:
          NPM_HIT: ${{ steps.node.outputs.cache-hit }}
          DOWNLOAD_HIT: ${{ steps.downloads.outputs.cache-hit || 'miss or unavailable' }}
          DOWNLOAD_MATCHED: ${{ steps.downloads.outputs.cache-matched-key || 'none' }}
          DOWNLOAD_SAVE: ${{ steps.save_downloads.outcome || 'unavailable' }}
        run: |
          @(
            '### Windows cache evidence'
            "npm exact hit: $env:NPM_HIT"
            "NuGet, Electron and node-gyp downloads exact hit: $env:DOWNLOAD_HIT. Matched key: $env:DOWNLOAD_MATCHED. Save step: $env:DOWNLOAD_SAVE."
          ) | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout release publisher
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Download native artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: native-release-assets
          path: dist-native

      - name: Publish Windows assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash scripts/publish-production-release.sh dist-native/*
