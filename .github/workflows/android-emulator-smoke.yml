# Temporary emulator proof for the Android Rust renderer. Development-client
# build only, never published. Dispatch manually on a non-main branch.
name: Android emulator smoke

on:
  workflow_dispatch:
  push:
    branches:
      - android-shim-wip

permissions:
  contents: read

concurrency:
  group: android-emulator-smoke-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  smoke:
    name: Rust lyrics on x86_64 emulator
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ExpoLyrics/package-lock.json

      - name: Install JS dependencies
        working-directory: ExpoLyrics
        run: npm ci

      - name: Setup Java
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Setup Android NDK and Rust
        run: |
          set -euo pipefail
          ndk_version=$(node -e 'const fs = require("fs"); const source = fs.readFileSync("ExpoLyrics/node_modules/react-native/gradle/libs.versions.toml", "utf8"); const match = source.match(/^ndkVersion\s*=\s*"([0-9.]+)"/m); if (!match) throw new Error("NDK version not found"); process.stdout.write(match[1]);')
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          sdkmanager="$(command -v sdkmanager || ls "${sdk_root}"/cmdline-tools/*/bin/sdkmanager | head -1)"
          yes | "${sdkmanager}" --licenses >/dev/null || true
          "${sdkmanager}" --install "ndk;${ndk_version}"
          echo "ANDROID_NDK_HOME=${sdk_root}/ndk/${ndk_version}" >> "$GITHUB_ENV"
          rustup toolchain install 1.97.0 --profile minimal
          cargo +1.97.0 install cargo-ndk --version 4.1.2 --locked

      - name: Build Rust archive (x86_64)
        run: bash scripts/build-rust-lyrics-android.sh x86_64

      - name: Prebuild and assemble debug APK
        working-directory: ExpoLyrics
        run: |
          set -euo pipefail
          npx expo prebuild --clean --platform android
          (cd android && ./gradlew --no-daemon --stacktrace --max-workers=2 \
            '-Dorg.gradle.jvmargs=-Xmx5g -XX:MaxMetaspaceSize=1g' \
            -PreactNativeArchitectures=x86_64 :app:assembleDebug)
          unzip -l android/app/build/outputs/apk/debug/app-debug.apk | grep -i 'x86_64.*kinesync\|x86_64.*rust'

      - name: Start Metro
        working-directory: ExpoLyrics
        run: |
          nohup npx expo start --dev-client --port 8081 > "$RUNNER_TEMP/metro.log" 2>&1 &
          for i in $(seq 1 30); do curl -sf localhost:8081/status && break; sleep 2; done

      - name: Run emulator smoke
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -feature Vulkan
          script: bash scripts/android-emulator-smoke.sh

      - name: Upload smoke output
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-emulator-smoke
          path: |
            smoke-out
            ${{ runner.temp }}/metro.log
          if-no-files-found: warn
