# Builds an iOS device IPA without Apple Developer Portal signing.
# Main-branch pushes publish iOS files to the shared versioned production
# release. Per-commit history remains available in Actions artifacts.
# Manual runs produce only a workflow artifact.
# The IPA can be re-signed locally (e.g. SideStore or Sideloadly).
# We disable signing entirely for CI so Pod/library targets are not asked to
# sign with an empty identity.

name: iOS unsigned IPA

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-unsigned-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  ios-unsigned-ipa:
    runs-on: xcode-27
    timeout-minutes: 120
    env:
      RUST_CACHE_WITHIN_BUDGET: 'false'

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Node
        id: node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ExpoLyrics/package-lock.json

      - name: Install JS dependencies
        working-directory: ExpoLyrics
        run: npm ci

      - name: Verify iOS 27 toolchain
        run: |
          set -euo pipefail
          xcodebuild -version
          xcodebuild -showsdks
          [[ $(xcrun --sdk iphoneos --show-sdk-version) == 27.* ]]
          echo "DERIVED_DATA_PATH=$RUNNER_TEMP/kinesync-ios-release-derived" >> "$GITHUB_ENV"

      - name: Identify CocoaPods release downloads
        id: pod_key
        continue-on-error: true
        run: |
          set -euo pipefail
          echo "CP_CACHE_DIR=$RUNNER_TEMP/kinesync-release-cocoapods" >> "$GITHUB_ENV"
          version=$(pod --version)
          [[ -n "$version" ]]
          # Hash app.json before it receives the per-run iOS build number.
          pod_inputs=$(git ls-files -z -- ExpoLyrics/package-lock.json ExpoLyrics/patches ExpoLyrics/app.json 'ExpoLyrics/modules/*.podspec' |
            xargs -0 shasum -a 256 | shasum -a 256 | cut -d' ' -f1)
          prefix="ios-release-pod-downloads-v2-${RUNNER_OS}-${RUNNER_ARCH}-${version}-"
          echo "prefix=$prefix" >> "$GITHUB_OUTPUT"
          echo "key=${prefix}${pod_inputs}" >> "$GITHUB_OUTPUT"

      - name: Set shared release version
        working-directory: ExpoLyrics
        run: |
          version=$(node ../scripts/release-version.js)
          node scripts/stamp-ios-release-version.js "${version}" "${GITHUB_RUN_NUMBER}"

      - name: Set up the iOS Release Rust toolchain
        id: rust_identity
        run: |
          set -euo pipefail
          config() { node -p 'require("./scripts/ios-dev-ci/config.json").rust[process.argv[1]]' "$1"; }
          toolchain=$(config toolchain)
          target=$(config target)
          target_dir="$RUNNER_TEMP/kinesync-release-cargo"
          sdk=$(xcrun --sdk iphoneos --show-sdk-path)
          rustup toolchain install "$toolchain" --profile minimal --target "$target" --component llvm-tools-preview
          {
            echo "toolchain=$toolchain"
            echo "target=$target"
            echo "target_dir=$target_dir"
            echo "cargo_home=$RUNNER_TEMP/kinesync-release-cargo-home"
            echo "sdk=$sdk"
            echo "deployment=$(config iosDeploymentTarget)"
            echo "rustflags=$(config rustflags)"
            echo "opt_level=$(config optLevel)"
            echo "debug_info=$(config debugInfo)"
            echo "lto=$(config lto)"
            echo "debug_assertions=$(config debugAssertions)"
            echo "incremental=${CARGO_INCREMENTAL:-}"
          } >> "$GITHUB_OUTPUT"

      - name: Identify iOS Release compiler caches
        id: compiler_key
        continue-on-error: true
        env:
          TARGET_DIR: ${{ steps.rust_identity.outputs.target_dir }}
        run: |
          set -euo pipefail
          rust_inputs=$(shasum -a 256 scripts/ios-dev-ci/config.json scripts/ios-dev-ci/build-rust-device.sh | shasum -a 256 | cut -d' ' -f1)
          relative_target_dir=$(node -p 'require("node:path").relative("native/lyrics-renderer", process.argv[1])' "$TARGET_DIR")
          compiler_identity=$( (xcodebuild -version && xcrun --sdk iphoneos --show-sdk-build-version && xcrun --sdk iphoneos clang --version) | shasum -a 256 | cut -d' ' -f1 )
          echo "relative_target_dir=$relative_target_dir" >> "$GITHUB_OUTPUT"
          echo "compiler=$compiler_identity" >> "$GITHUB_OUTPUT"
          echo "rust_prefix=ios-release-rust-v2-${compiler_identity}-${rust_inputs}" >> "$GITHUB_OUTPUT"

      - name: Cache iOS Release Rust dependencies and target work
        id: rust
        if: steps.compiler_key.outcome == 'success' && steps.compiler_key.outputs.rust_prefix != ''
        continue-on-error: true
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        env:
          RUSTUP_TOOLCHAIN: ${{ steps.rust_identity.outputs.toolchain }}
          RUST_DEVICE_TARGET: ${{ steps.rust_identity.outputs.target }}
          CARGO_HOME: ${{ steps.rust_identity.outputs.cargo_home }}
          CARGO_TARGET_DIR: ${{ steps.rust_identity.outputs.target_dir }}
          SDKROOT: ${{ steps.rust_identity.outputs.sdk }}
          IPHONEOS_DEPLOYMENT_TARGET: ${{ steps.rust_identity.outputs.deployment }}
          RUSTFLAGS: ${{ steps.rust_identity.outputs.rustflags }}
          CARGO_PROFILE_RELEASE_OPT_LEVEL: ${{ steps.rust_identity.outputs.opt_level }}
          CARGO_PROFILE_RELEASE_DEBUG: ${{ steps.rust_identity.outputs.debug_info }}
          CARGO_PROFILE_RELEASE_LTO: ${{ steps.rust_identity.outputs.lto }}
          CARGO_PROFILE_RELEASE_DEBUG_ASSERTIONS: ${{ steps.rust_identity.outputs.debug_assertions }}
          KINESYNC_ORIGINAL_INCREMENTAL: ${{ steps.rust_identity.outputs.incremental }}
        with:
          prefix-key: ${{ steps.compiler_key.outputs.rust_prefix }}
          # Rust Cache resolves the RHS from the crate, even with an absolute LHS.
          workspaces: native/lyrics-renderer -> ${{ steps.compiler_key.outputs.relative_target_dir }}
          env-vars: SDKROOT IPHONEOS_DEPLOYMENT_TARGET DEVELOPER_DIR AR ARFLAGS CPPFLAGS LDFLAGS KINESYNC_ORIGINAL_INCREMENTAL
          cache-targets: true
          cache-all-crates: true
          cache-workspace-crates: true
          cache-bin: false
          cache-on-failure: false
          # The runner evaluates action inputs again for the success-only post.
          save-if: ${{ env.RUST_CACHE_WITHIN_BUDGET == 'true' }}

      - name: Clear unconfirmed iOS Release Rust restore
        if: steps.rust.outcome != 'skipped' && (steps.rust.outcome != 'success' || steps.rust.outputs.cache-hit != 'true')
        env:
          CARGO_HOME: ${{ steps.rust_identity.outputs.cargo_home }}
          CARGO_TARGET_DIR: ${{ steps.rust_identity.outputs.target_dir }}
        run: rm -rf -- "${CARGO_TARGET_DIR:?}" "${CARGO_HOME:?}/registry" "$CARGO_HOME/git"

      - name: Prepare Rust lyrics framework for iOS Release
        env:
          CARGO_HOME: ${{ steps.rust_identity.outputs.cargo_home }}
          CARGO_TARGET_DIR: ${{ steps.rust_identity.outputs.target_dir }}
          IPHONEOS_DEPLOYMENT_TARGET: ${{ steps.rust_identity.outputs.deployment }}
          RUSTFLAGS: ${{ steps.rust_identity.outputs.rustflags }}
          CARGO_PROFILE_RELEASE_OPT_LEVEL: ${{ steps.rust_identity.outputs.opt_level }}
          CARGO_PROFILE_RELEASE_DEBUG: ${{ steps.rust_identity.outputs.debug_info }}
          CARGO_PROFILE_RELEASE_LTO: ${{ steps.rust_identity.outputs.lto }}
          CARGO_PROFILE_RELEASE_DEBUG_ASSERTIONS: ${{ steps.rust_identity.outputs.debug_assertions }}
          KINESYNC_ORIGINAL_INCREMENTAL: ${{ steps.rust_identity.outputs.incremental }}
        run: |
          set -euo pipefail
          if [[ -n "$KINESYNC_ORIGINAL_INCREMENTAL" ]]; then
            export CARGO_INCREMENTAL="$KINESYNC_ORIGINAL_INCREMENTAL"
          else
            unset CARGO_INCREMENTAL
          fi
          export CI_EVIDENCE_DIR="$RUNNER_TEMP/kinesync-release-evidence"
          export RUST_PREBUILT_DIR="$RUNNER_TEMP/kinesync-release-framework"
          export RUST_DEVICE_KEY="$GITHUB_SHA"
          mkdir -p "$CI_EVIDENCE_DIR"
          bash scripts/ios-dev-ci/build-rust-device.sh
          node scripts/ios-dev-ci/rust-device.cjs validate

      - name: Restore CocoaPods release downloads
        id: pods
        if: steps.pod_key.outcome == 'success' && steps.pod_key.outputs.key != ''
        continue-on-error: true
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ${{ env.CP_CACHE_DIR }}/Pods/Release
            ${{ env.CP_CACHE_DIR }}/Pods/Specs/Release
            ${{ env.CP_CACHE_DIR }}/Pods/VERSION
          key: ${{ steps.pod_key.outputs.key }}
          restore-keys: ${{ steps.pod_key.outputs.prefix }}

      - name: Clear incomplete CocoaPods restore
        if: steps.pods.outcome != 'skipped' && (steps.pods.outcome != 'success' || steps.pods.outputs.cache-matched-key == '')
        run: rm -rf -- "${CP_CACHE_DIR:?}/Pods"

      - name: Expo prebuild (iOS)
        working-directory: ExpoLyrics
        run: npx expo prebuild --clean --platform ios

      - name: Verify Spotify login and app types
        working-directory: ExpoLyrics
        run: |
          npm run test:spotify-browser
          npm run test:security
          npx tsc --noEmit

      - name: Identify Release DerivedData compiler cache
        id: derived_key
        if: steps.compiler_key.outcome == 'success' && steps.compiler_key.outputs.compiler != ''
        continue-on-error: true
        env:
          COMPILER: ${{ steps.compiler_key.outputs.compiler }}
        run: |
          set -euo pipefail
          if [[ ! -f ExpoLyrics/ios/Podfile.lock ]]; then exit 0; fi
          inputs=(ExpoLyrics/ios/Podfile ExpoLyrics/ios/Podfile.lock)
          if [[ -f ExpoLyrics/ios/Podfile.properties.json ]]; then inputs+=(ExpoLyrics/ios/Podfile.properties.json); fi
          pod_inputs=$(shasum -a 256 "${inputs[@]}" | shasum -a 256 | cut -d' ' -f1)
          echo "key=ios-release-derived-compiler-v1-${RUNNER_OS}-${RUNNER_ARCH}-${COMPILER}-${GITHUB_SHA}-${pod_inputs}" >> "$GITHUB_OUTPUT"

      - name: Restore Release DerivedData compiler caches
        id: derived
        if: steps.derived_key.outcome == 'success' && steps.derived_key.outputs.key != ''
        continue-on-error: true
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          # Compiler caches only. Xcode must produce all app and Pod products.
          path: |
            ${{ env.DERIVED_DATA_PATH }}/ModuleCache.noindex
            ${{ env.DERIVED_DATA_PATH }}/SDKStatCaches.noindex
          key: ${{ steps.derived_key.outputs.key }}

      - name: Clear incomplete Release DerivedData restore
        if: steps.derived.outcome != 'skipped' && (steps.derived.outcome != 'success' || steps.derived.outputs.cache-matched-key == '')
        run: rm -rf -- "${DERIVED_DATA_PATH:?}/ModuleCache.noindex" "$DERIVED_DATA_PATH/SDKStatCaches.noindex"

      - name: Build Release and locate .app
        run: |
          set -euo pipefail
          node <<'NODE'
          const { execSync, spawnSync } = require("child_process");
          const fs = require("fs");
          const path = require("path");

          const iosDir = path.join(process.env.GITHUB_WORKSPACE, "ExpoLyrics", "ios");
          const derived =
            process.env.DERIVED_DATA_PATH || path.join(iosDir, "build");
          const marker = path.join(iosDir, ".ci_built_app");

          const ws = fs
            .readdirSync(iosDir)
            .find((f) => f.endsWith(".xcworkspace"));
          if (!ws) throw new Error("No .xcworkspace in ios/");

          const listJson = execSync(
            `xcodebuild -workspace "${path.join(iosDir, ws)}" -list -json`,
            { encoding: "utf8", cwd: iosDir },
          );
          const j = JSON.parse(listJson);
          const schemes = j.workspace.schemes || [];
          const proj = fs
            .readdirSync(iosDir)
            .find((f) => f.endsWith(".xcodeproj"));
          const projBase = proj ? path.basename(proj, ".xcodeproj") : null;
          const scheme =
            (projBase && schemes.find((s) => s === projBase)) ||
            schemes.find((s) => !String(s).startsWith("Pods")) ||
            schemes[0];
          if (!scheme) throw new Error("No Xcode schemes found");

          console.log("iosDir:", iosDir);
          console.log("derivedDataPath:", derived);
          console.log("Using workspace:", ws, "scheme:", scheme);

          const signing = [
            "CODE_SIGNING_ALLOWED=NO",
            "CODE_SIGNING_REQUIRED=NO",
            "CODE_SIGN_STYLE=Manual",
            "DEVELOPMENT_TEAM=",
            "PROVISIONING_PROFILE_SPECIFIER=",
            "PROVISIONING_PROFILE=",
            "EXPANDED_CODE_SIGN_IDENTITY=",
            "COMPILER_INDEX_STORE_ENABLE=NO",
          ];

          const common = [
            "-workspace",
            path.join(iosDir, ws),
            "-scheme",
            scheme,
            "-configuration",
            "Release",
            "-sdk",
            "iphoneos",
            "-destination",
            "generic/platform=iOS",
            "-derivedDataPath",
            derived,
            ...signing,
          ];

          function skipPath(p) {
            return /\/Pods\//.test(p) || /\/XCFrameworkIntermediates\//.test(p);
          }

          function listAppsUnder(root) {
            const apps = [];
            function walk(dir) {
              let entries;
              try {
                entries = fs.readdirSync(dir, { withFileTypes: true });
              } catch {
                return;
              }
              for (const ent of entries) {
                if (!ent.isDirectory()) continue;
                const p = path.join(dir, ent.name);
                if (skipPath(p)) continue;
                if (p.endsWith(".app")) apps.push(p);
                else walk(p);
              }
            }
            walk(root);
            return apps;
          }

          function pickApp(apps, scheme) {
            if (apps.length === 0) return null;
            const byScheme = apps.find((a) => a.endsWith(`/${scheme}.app`));
            if (byScheme) return byScheme;
            const inProducts = apps.filter((a) =>
              /Build\/Products\/Release-iphoneos\//.test(a),
            );
            const pool = inProducts.length ? inProducts : apps;
            return pool.sort((a, b) => a.length - b.length)[0];
          }

          function runBuild(action, extra) {
            const args = [...common, ...extra, action];
            console.log("xcodebuild", args.join(" "));
            const r = spawnSync("xcodebuild", args, {
              stdio: "inherit",
              cwd: iosDir,
            });
            if (r.status === null || r.status !== 0) {
              process.exit(r.status === null ? 1 : r.status);
            }
          }

          runBuild("build", []);

          let apps = listAppsUnder(path.join(derived, "Build", "Products", "Release-iphoneos"));
          if (apps.length === 0) apps = listAppsUnder(derived);

          let chosen = pickApp(apps, scheme);

          if (!chosen) {
            console.log("No .app after build; trying xcodebuild archive…");
            const archivePath = path.join(iosDir, "ExpoLyricsUnsigned.xcarchive");
            fs.rmSync(archivePath, { recursive: true, force: true });
            runBuild("archive", ["-archivePath", archivePath]);
            const archAppsDir = path.join(
              archivePath,
              "Products",
              "Applications",
            );
            apps = listAppsUnder(archAppsDir);
            chosen = pickApp(apps, scheme);
          }

          if (!chosen) {
            console.error("Could not locate host .app after build/archive.");
            console.error(
              "Under Release-iphoneos:",
              listAppsUnder(
                path.join(derived, "Build", "Products", "Release-iphoneos"),
              ),
            );
            process.exit(1);
          }

          console.log("Selected .app:", chosen);
          fs.writeFileSync(marker, chosen, "utf8");
          NODE

      - name: Verify Release Rust lyrics registration and linkage
        run: |
          set -euo pipefail
          node <<'NODE'
          const { execFileSync } = require('node:child_process');
          const fs = require('node:fs');
          const path = require('node:path');
          const { releaseSymbols } = require('./scripts/ios-dev-ci/rust-device.cjs');

          const ios = 'ExpoLyrics/ios';
          const app = fs.realpathSync(fs.readFileSync(path.join(ios, '.ci_built_app'), 'utf8').trim());
          const run = (tool, args, input) => execFileSync(tool, args, {
            encoding: 'utf8', maxBuffer: 128 * 1024 * 1024, input,
          });
          const executable = run('plutil', ['-extract', 'CFBundleExecutable', 'raw', '-o', '-', path.join(app, 'Info.plist')]).trim();
          const image = path.join(app, executable);
          const evidence = 'ExpoLyrics/ios-release-evidence';
          fs.mkdirSync(evidence, { recursive: true });
          const save = (file, data) => fs.writeFileSync(path.join(evidence, file), data);

          const provider = fs.readFileSync(path.join(ios, 'Pods/Target Support Files', `Pods-${executable}`, 'ExpoModulesProvider.swift'), 'utf8');
          save('ExpoModulesProvider.swift', provider);
          const registrations = provider.match(/^  public override func getModuleClasses\(\)[^\n]*\{\n([\s\S]*?)^  \}/m)?.[1].trim();
          // Expo duplicates common registrations in both branches when other modules are debug-only.
          const debug = registrations?.match(/^#if (?:EXPO_CONFIGURATION_DEBUG|DEBUG)\n([\s\S]*?)\n[ \t]*#else\n([\s\S]*?)\n[ \t]*#endif$/);
          const branches = debug ? debug.slice(1) : [registrations];
          if (!branches.every(branch => branch && /^return \[[^#]*\]$/.test(branch.trim()) &&
              /^\s*\(module: KineSyncRustLyricsModule\.self,/m.test(branch))) {
            throw new Error('Generated ExpoModulesProvider lacks unconditional KineSyncRustLyricsModule registration');
          }

          const nm = run('xcrun', ['nm', '-arch', 'arm64', '-U', image]);
          save('app-nm.txt', nm);
          const swift = nm.split('\n').filter(line => line.includes('KineSyncRustLyrics')).join('\n');
          const demangled = run('xcrun', ['swift-demangle'], `${swift}\n`);
          save('app-rust-demangled-nm.txt', demangled);
          if (!/(?:type metadata(?: accessor)?|nominal type descriptor) for KineSyncRustLyrics\.KineSyncRustLyricsModule\s*$/m.test(demangled) &&
              !/\b_OBJC_CLASS_\$_(?:_TtC18KineSyncRustLyrics24)?KineSyncRustLyricsModule\s*$/m.test(nm)) {
            throw new Error('Release app Mach-O lacks the Swift or Objective-C identity of KineSyncRustLyricsModule');
          }
          for (const symbol of releaseSymbols) {
            if (!new RegExp(`\\b[Tt]\\s+_${symbol}$`, 'm').test(nm)) {
              throw new Error(`Release app Mach-O lacks defined Rust FFI symbol ${symbol}`);
            }
          }

          const loads = new Map();
          const system = file => file.startsWith('/usr/lib/') || file.startsWith('/System/Library/');
          function expand(file, loader) {
            return path.normalize(file.replace(/^@loader_path\//, `${path.dirname(loader)}/`)
              .replace(/^@executable_path\//, `${app}/`));
          }
          function resolve(file) {
            if (system(file)) return file;
            if (!file.startsWith(`${app}/`) || !fs.statSync(file, { throwIfNoEntry: false })?.isFile()) return;
            const real = fs.realpathSync(file);
            if (real.startsWith(`${app}/`)) return real;
          }
          function verifyLoads(loader, inheritedRpaths = [], chain = []) {
            if (chain.includes(loader)) return;
            if (!loads.has(loader)) {
              const output = run('xcrun', ['otool', '-arch', 'arm64', '-l', loader]);
              fs.appendFileSync(path.join(evidence, 'app-load-commands.txt'), output + '\n');
              const blocks = output.split(/\nLoad command \d+\n/).slice(1);
              if (!blocks.length) throw new Error(`No arm64 Mach-O load commands in ${loader}`);
              const rpaths = [];
              const dependencies = [];
              for (const block of blocks) {
                const command = block.match(/^\s*cmd (LC_\S+)/)?.[1];
                const isRpath = command === 'LC_RPATH';
                if (!isRpath && !/^LC_(?:LOAD(?:_WEAK|_UPWARD)?|REEXPORT|LAZY_LOAD)_DYLIB$/.test(command)) continue;
                const value = block.match(/^\s*(?:path|name) (.+) \(offset \d+\)$/m)?.[1];
                if (!value) throw new Error(`Cannot read ${command} in ${loader}`);
                if (isRpath) rpaths.push(expand(value, loader));
                else dependencies.push(value);
              }
              loads.set(loader, { rpaths, dependencies });
            }
            const { rpaths: ownRpaths, dependencies } = loads.get(loader);
            const rpaths = [...ownRpaths, ...inheritedRpaths];
            for (const dependency of dependencies) {
              const candidates = dependency.startsWith('@rpath/')
                ? rpaths.map(rpath => path.join(rpath, dependency.slice('@rpath/'.length)))
                : [expand(dependency, loader)];
              const resolved = candidates.map(resolve).find(Boolean);
              if (!resolved) throw new Error(`Missing dylib dependency ${dependency} loaded by ${loader}`);
              if (!system(resolved)) verifyLoads(resolved, rpaths, [...chain, loader]);
            }
          }
          verifyLoads(image);
          NODE

      - name: Package IPA (Payload + zip)
        run: |
          set -euo pipefail
          MARKER="${GITHUB_WORKSPACE}/ExpoLyrics/ios/.ci_built_app"
          APP=$(head -1 "${MARKER}")
          if [[ ! -d "${APP}" ]]; then
            echo "Invalid path from ${MARKER}: ${APP}"
            exit 1
          fi
          echo "Packaging: ${APP}"
          STAGE="${RUNNER_TEMP}/ipa-payload"
          rm -rf "${STAGE}"
          mkdir -p "${STAGE}/Payload"
          APP_BASENAME=$(basename "${APP}")
          ditto "${APP}" "${STAGE}/Payload/${APP_BASENAME}"

          IPA="${GITHUB_WORKSPACE}/ExpoLyrics/KineSync-iOS-unsigned.ipa"
          rm -f "${IPA}"
          ditto -c -k --sequesterRsrc --keepParent "${STAGE}/Payload" "${IPA}"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ExpoLyrics-unsigned-ipa
          path: |
            ExpoLyrics/KineSync-iOS-unsigned.ipa
            ExpoLyrics/ios-release-version.txt
            ExpoLyrics/ios-release-evidence/
          if-no-files-found: error
          # The IPA is already a zip; recompressing only burns minutes.
          compression-level: 0

      - name: Bound iOS Release Rust cache
        if: success() && steps.rust.outcome == 'success' && steps.compiler_key.outputs.rust_prefix != ''
        continue-on-error: true
        env:
          CARGO_HOME: ${{ steps.rust_identity.outputs.cargo_home }}
          CARGO_TARGET_DIR: ${{ steps.rust_identity.outputs.target_dir }}
        run: |
          set -euo pipefail
          kib=0
          for path in "$CARGO_TARGET_DIR" "$CARGO_HOME/registry" "$CARGO_HOME/git"; do
            if [[ -d "$path" ]]; then
              size=$(du -sk "$path" | cut -f1)
              kib=$(( kib + size ))
            fi
          done
          echo "iOS Release Rust files before Rust Cache pruning: $kib KiB (save limit: 1572864 KiB)"
          if (( kib <= 1572864 )); then echo 'RUST_CACHE_WITHIN_BUDGET=true' >> "$GITHUB_ENV"; fi

      - name: Bound CocoaPods download cache
        id: pod_size
        continue-on-error: true
        if: success() && steps.pod_key.outputs.key != '' && steps.pods.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          root="${CP_CACHE_DIR:?}/Pods"
          if [[ ! -d "$root/Release" || ! -d "$root/Specs/Release" || ! -f "$root/VERSION" ]]; then exit 0; fi
          kib=$(du -sk "$root/Release" "$root/Specs/Release" "$root/VERSION" | awk '{sum += $1} END {print sum+0}')
          echo "CocoaPods release downloads: $kib KiB (save limit: 393216 KiB)"
          if (( kib <= 393216 )); then echo 'within-budget=true' >> "$GITHUB_OUTPUT"; fi

      - name: Save CocoaPods release downloads
        id: save_pods
        if: success() && steps.pod_size.outcome == 'success' && steps.pod_key.outputs.key != '' && steps.pod_size.outputs.within-budget == 'true'
        continue-on-error: true
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ${{ env.CP_CACHE_DIR }}/Pods/Release
            ${{ env.CP_CACHE_DIR }}/Pods/Specs/Release
            ${{ env.CP_CACHE_DIR }}/Pods/VERSION
          key: ${{ steps.pod_key.outputs.key }}

      - name: Bound Release DerivedData compiler caches
        id: derived_size
        continue-on-error: true
        if: success() && steps.derived_key.outputs.key != '' && steps.derived.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          kib=0
          for path in "$DERIVED_DATA_PATH/ModuleCache.noindex" "$DERIVED_DATA_PATH/SDKStatCaches.noindex"; do
            if [[ -d "$path" ]]; then
              size=$(du -sk "$path" | cut -f1)
              kib=$(( kib + size ))
            fi
          done
          echo "Release DerivedData compiler caches: $kib KiB (save limit: 262144 KiB)"
          if (( kib > 0 && kib <= 262144 )); then echo 'within-budget=true' >> "$GITHUB_OUTPUT"; fi

      - name: Save Release DerivedData compiler caches
        id: save_derived
        if: success() && steps.derived_size.outcome == 'success' && steps.derived_key.outputs.key != '' && steps.derived_size.outputs.within-budget == 'true'
        continue-on-error: true
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ${{ env.DERIVED_DATA_PATH }}/ModuleCache.noindex
            ${{ env.DERIVED_DATA_PATH }}/SDKStatCaches.noindex
          key: ${{ steps.derived_key.outputs.key }}

      - name: Summarize iOS Release cache evidence
        continue-on-error: true
        if: always()
        env:
          NPM_HIT: ${{ steps.node.outputs.cache-hit }}
          RUST_HIT: ${{ steps.rust.outputs.cache-hit }}
          POD_HIT: ${{ steps.pods.outputs.cache-hit }}
          POD_MATCHED: ${{ steps.pods.outputs.cache-matched-key }}
          POD_SAVE: ${{ steps.save_pods.outcome }}
          DERIVED_HIT: ${{ steps.derived.outputs.cache-hit }}
          DERIVED_SAVE: ${{ steps.save_derived.outcome }}
        run: |
          {
            echo '### iOS Release cache evidence'
            printf 'npm exact hit: %s\n\n' "${NPM_HIT:-unknown}"
            printf 'Rust registry and targets exact hit: %s\n\n' "${RUST_HIT:-unknown}"
            printf 'Rust save within size budget: %s. See Rust cache post step.\n\n' "$RUST_CACHE_WITHIN_BUDGET"
            printf 'CocoaPods downloads exact hit: %s. Matched key: %s. Save step: %s.\n\n' "${POD_HIT:-miss or unavailable}" "${POD_MATCHED:-none}" "${POD_SAVE:-unavailable}"
            printf 'Release DerivedData compiler cache exact hit: %s. Save step: %s.\n' "${DERIVED_HIT:-miss or unavailable}" "${DERIVED_SAVE:-unavailable}"
          } | tee -a "$GITHUB_STEP_SUMMARY"

  publish-ios-release:
    name: Publish iOS assets
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: ios-unsigned-ipa
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout release metadata generator
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Download IPA
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ExpoLyrics-unsigned-ipa
          path: release-assets

      - name: Prepare iOS release metadata
        id: release
        run: |
          set -euo pipefail
          version=$(tr -d '\r\n' < release-assets/ios-release-version.txt)
          node ExpoLyrics/scripts/create-ios-release-metadata.js \
            "release-assets/KineSync-iOS-unsigned.ipa" \
            "${version}" \
            "${GITHUB_SHA}" \
            "release-assets"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Publish iOS assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash scripts/publish-production-release.sh \
            release-assets/KineSync-iOS-unsigned.ipa \
            release-assets/KineSync-iOS-unsigned.sha256 \
            release-assets/sidestore-source.json
