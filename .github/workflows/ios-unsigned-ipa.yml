# Builds an iOS device IPA without Apple Developer Portal signing.
# Every main-branch push creates an immutable ios-main-* prerelease. The current
# head also updates the friendly ios-latest alias. Neither tag can overlap the
# v* tags used by Windows native releases.
# Manual runs still produce only a workflow artifact.
# The IPA can be re-signed locally (e.g. SideStore or Sideloadly).
# We disable signing entirely for CI so Pod/library targets are not asked to
# sign with an empty identity.

name: iOS unsigned IPA

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  ios-unsigned-ipa:
    runs-on: macos-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ExpoLyrics/package-lock.json

      - name: Install JS dependencies
        working-directory: ExpoLyrics
        run: npm ci

      - name: Stamp unique iOS release version
        working-directory: ExpoLyrics
        run: node scripts/stamp-ios-release-version.js "${GITHUB_RUN_NUMBER}"

      - name: Expo prebuild (iOS)
        working-directory: ExpoLyrics
        run: npx expo prebuild --clean --platform ios

      - name: Build Release and locate .app
        run: |
          set -euo pipefail
          node <<'NODE'
          const { execSync, spawnSync } = require("child_process");
          const fs = require("fs");
          const path = require("path");

          const iosDir = path.join(process.env.GITHUB_WORKSPACE, "ExpoLyrics", "ios");
          const derived = path.join(iosDir, "build");
          const marker = path.join(iosDir, ".ci_built_app");

          const ws = fs
            .readdirSync(iosDir)
            .find((f) => f.endsWith(".xcworkspace"));
          if (!ws) throw new Error("No .xcworkspace in ios/");

          const listJson = execSync(
            `xcodebuild -workspace "${path.join(iosDir, ws)}" -list -json`,
            { encoding: "utf8", cwd: iosDir },
          );
          const j = JSON.parse(listJson);
          const schemes = j.workspace.schemes || [];
          const proj = fs
            .readdirSync(iosDir)
            .find((f) => f.endsWith(".xcodeproj"));
          const projBase = proj ? path.basename(proj, ".xcodeproj") : null;
          const scheme =
            (projBase && schemes.find((s) => s === projBase)) ||
            schemes.find((s) => !String(s).startsWith("Pods")) ||
            schemes[0];
          if (!scheme) throw new Error("No Xcode schemes found");

          console.log("iosDir:", iosDir);
          console.log("derivedDataPath:", derived);
          console.log("Using workspace:", ws, "scheme:", scheme);

          const signing = [
            "CODE_SIGNING_ALLOWED=NO",
            "CODE_SIGNING_REQUIRED=NO",
            "CODE_SIGN_STYLE=Manual",
            "DEVELOPMENT_TEAM=",
            "PROVISIONING_PROFILE_SPECIFIER=",
            "PROVISIONING_PROFILE=",
            "EXPANDED_CODE_SIGN_IDENTITY=",
            "COMPILER_INDEX_STORE_ENABLE=NO",
          ];

          const common = [
            "-workspace",
            path.join(iosDir, ws),
            "-scheme",
            scheme,
            "-configuration",
            "Release",
            "-sdk",
            "iphoneos",
            "-destination",
            "generic/platform=iOS",
            "-derivedDataPath",
            derived,
            ...signing,
          ];

          function skipPath(p) {
            return /\/Pods\//.test(p) || /\/XCFrameworkIntermediates\//.test(p);
          }

          function listAppsUnder(root) {
            const apps = [];
            function walk(dir) {
              let entries;
              try {
                entries = fs.readdirSync(dir, { withFileTypes: true });
              } catch {
                return;
              }
              for (const ent of entries) {
                if (!ent.isDirectory()) continue;
                const p = path.join(dir, ent.name);
                if (skipPath(p)) continue;
                if (p.endsWith(".app")) apps.push(p);
                else walk(p);
              }
            }
            walk(root);
            return apps;
          }

          function pickApp(apps, scheme) {
            if (apps.length === 0) return null;
            const byScheme = apps.find((a) => a.endsWith(`/${scheme}.app`));
            if (byScheme) return byScheme;
            const inProducts = apps.filter((a) =>
              /Build\/Products\/Release-iphoneos\//.test(a),
            );
            const pool = inProducts.length ? inProducts : apps;
            return pool.sort((a, b) => a.length - b.length)[0];
          }

          function runBuild(action, extra) {
            const args = [...common, ...extra, action];
            console.log("xcodebuild", args.join(" "));
            const r = spawnSync("xcodebuild", args, {
              stdio: "inherit",
              cwd: iosDir,
            });
            if (r.status === null || r.status !== 0) {
              process.exit(r.status === null ? 1 : r.status);
            }
          }

          runBuild("build", []);

          let apps = listAppsUnder(path.join(derived, "Build", "Products", "Release-iphoneos"));
          if (apps.length === 0) apps = listAppsUnder(derived);

          let chosen = pickApp(apps, scheme);

          if (!chosen) {
            console.log("No .app after build; trying xcodebuild archive…");
            const archivePath = path.join(iosDir, "ExpoLyricsUnsigned.xcarchive");
            fs.rmSync(archivePath, { recursive: true, force: true });
            runBuild("archive", ["-archivePath", archivePath]);
            const archAppsDir = path.join(
              archivePath,
              "Products",
              "Applications",
            );
            apps = listAppsUnder(archAppsDir);
            chosen = pickApp(apps, scheme);
          }

          if (!chosen) {
            console.error("Could not locate host .app after build/archive.");
            console.error(
              "Under Release-iphoneos:",
              listAppsUnder(
                path.join(derived, "Build", "Products", "Release-iphoneos"),
              ),
            );
            process.exit(1);
          }

          console.log("Selected .app:", chosen);
          fs.writeFileSync(marker, chosen, "utf8");
          NODE

      - name: Package IPA (Payload + zip)
        run: |
          set -euo pipefail
          MARKER="${GITHUB_WORKSPACE}/ExpoLyrics/ios/.ci_built_app"
          APP=$(head -1 "${MARKER}")
          if [[ ! -d "${APP}" ]]; then
            echo "Invalid path from ${MARKER}: ${APP}"
            exit 1
          fi
          echo "Packaging: ${APP}"
          STAGE="${RUNNER_TEMP}/ipa-payload"
          rm -rf "${STAGE}"
          mkdir -p "${STAGE}/Payload"
          APP_BASENAME=$(basename "${APP}")
          ditto "${APP}" "${STAGE}/Payload/${APP_BASENAME}"

          IPA="${GITHUB_WORKSPACE}/ExpoLyrics/KineSync-iOS-unsigned.ipa"
          rm -f "${IPA}"
          ditto -c -k --sequesterRsrc --keepParent "${STAGE}/Payload" "${IPA}"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ExpoLyrics-unsigned-ipa
          path: |
            ExpoLyrics/KineSync-iOS-unsigned.ipa
            ExpoLyrics/ios-release-version.txt
          if-no-files-found: error

  publish-ios-prerelease:
    name: Publish iOS-only prerelease
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: ios-unsigned-ipa
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout release metadata generator
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Download verified IPA
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ExpoLyrics-unsigned-ipa
          path: release-assets

      - name: Prepare iOS release metadata
        id: release
        run: |
          set -euo pipefail
          version=$(tr -d '\r\n' < release-assets/ios-release-version.txt)
          short_sha="${GITHUB_SHA:0:7}"
          node ExpoLyrics/scripts/create-ios-release-metadata.js \
            "release-assets/KineSync-iOS-unsigned.ipa" \
            "${version}" \
            "${GITHUB_SHA}" \
            "release-assets"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "release_name=KineSync iOS unsigned — ${version} (main ${short_sha})" >> "${GITHUB_OUTPUT}"

      - name: Create immutable iOS commit prerelease
        uses: softprops/action-gh-release@fe965f7af51af5f2602596916f38a38df2e33de0 # v3.0.2
        with:
          tag_name: ios-main-${{ github.sha }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.release.outputs.release_name }}
          body: |
            Immutable unsigned iOS build for SideStore and Sideloadly, generated from [`main` commit ${{ github.sha }}](https://github.com/${{ github.repository }}/commit/${{ github.sha }}).

            - **Integrity:** Verify the IPA with `KineSync-iOS-unsigned.sha256` if desired.
            - **Instructions:** [SideStore and Sideloadly installation guide](https://github.com/${{ github.repository }}/blob/main/IOS_INSTALL.md)

            For the permanent newest-build URL and SideStore update source, use the separate [`ios-latest` release](https://github.com/${{ github.repository }}/releases/tag/ios-latest). Windows native binaries remain on stable `v*` releases.
          files: |
            release-assets/KineSync-iOS-unsigned.ipa
            release-assets/KineSync-iOS-unsigned.sha256
          fail_on_unmatched_files: true
          overwrite_files: true
          draft: false
          prerelease: true
          make_latest: false

      - name: Check whether this commit is still the head of main
        id: main-head
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          head_sha=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')
          if [[ "${head_sha}" == "${GITHUB_SHA}" ]]; then
            echo "is_current=true" >> "${GITHUB_OUTPUT}"
          else
            echo "is_current=false" >> "${GITHUB_OUTPUT}"
            echo "Skipping ios-latest update: main is now ${head_sha}."
          fi

      - name: Update friendly rolling iOS release
        if: steps.main-head.outputs.is_current == 'true'
        uses: softprops/action-gh-release@fe965f7af51af5f2602596916f38a38df2e33de0 # v3.0.2
        with:
          tag_name: ios-latest
          target_commitish: ${{ github.sha }}
          name: KineSync iOS unsigned — latest (${{ steps.release.outputs.version }})
          body: |
            Latest successful unsigned iOS build from [`main` commit ${{ github.sha }}](https://github.com/${{ github.repository }}/commit/${{ github.sha }}), ready for SideStore or Sideloadly.

            - **Direct IPA:** Download `KineSync-iOS-unsigned.ipa` below.
            - **SideStore updates:** Add this source URL: `https://github.com/${{ github.repository }}/releases/download/ios-latest/sidestore-source.json`
            - **Integrity:** Verify the IPA with `KineSync-iOS-unsigned.sha256` if desired.
            - **Instructions:** [SideStore and Sideloadly installation guide](https://github.com/${{ github.repository }}/blob/main/IOS_INSTALL.md)

            This rolling prerelease contains only the iOS app. Windows native binaries remain on the separate stable `v*` releases.
          files: |
            release-assets/KineSync-iOS-unsigned.ipa
            release-assets/KineSync-iOS-unsigned.sha256
            release-assets/sidestore-source.json
          fail_on_unmatched_files: true
          overwrite_files: true
          draft: false
          prerelease: true
          make_latest: false
