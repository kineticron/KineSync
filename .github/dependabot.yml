version: 2
updates:
  - package-ecosystem: npm
    directory: /website
    schedule:
      interval: weekly
    groups:
      website-compatible-updates:
        update-types: [minor, patch]
    open-pull-requests-limit: 3
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    open-pull-requests-limit: 3
  - package-ecosystem: npm
    directory: /DesktopBridge
    schedule:
      interval: weekly
    groups:
      compatible-updates:
        update-types: [minor, patch]
    open-pull-requests-limit: 3
  - package-ecosystem: npm
    directory: /ExpoLyrics
    schedule:
      interval: weekly
    groups:
      mobile-runtime:
        patterns: ["expo", "expo-*", "@expo/*", "react", "react-dom", "react-native", "react-native-*", "@react-native/*", "@types/react", "eslint-config-expo"]
      other-compatible-updates:
        update-types: [minor, patch]
    open-pull-requests-limit: 3
  - package-ecosystem: npm
    directory: /DesktopBridge/native/windows-media-session
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
  - package-ecosystem: npm
    directory: /DesktopBridge/docker/runtime
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
  - package-ecosystem: docker
    directory: /DesktopBridge
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
