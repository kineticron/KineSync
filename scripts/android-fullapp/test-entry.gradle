// Opt in with -I for a disposable full-app test build only.
// Register before the React plugin's afterEvaluate task configuration.
gradle.beforeProject { project ->
    project.afterEvaluate {
        if (project.plugins.hasPlugin('com.facebook.react') && project.plugins.hasPlugin('com.android.application')) {
            def entry = new File(project.rootDir, '../scripts/fixtures/fullapp-test-entry.js')
            if (!entry.isFile()) {
                throw new GradleException('Run this init script from the generated ExpoLyrics/android project')
            }
            def react = project.extensions.getByName('react')
            react.entryFile.set(entry)
            // Bundle the fixture entry even for debug variants, without Metro.
            react.debuggableVariants.set([])
        }
    }
}
