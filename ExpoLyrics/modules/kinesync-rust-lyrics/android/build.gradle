plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'dev.kineticron.kinesync'
version = '1.0.0'

def reactNativeArchitectures() {
  def value = project.getProperties().get("reactNativeArchitectures")
  return value ? value.split(",").collect { it.trim() } : ["arm64-v8a", "x86_64"]
}

android {
  namespace "dev.kineticron.rustlyrics"
  buildFeatures {
    buildConfig = true
  }
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
    ndk { abiFilters(*reactNativeArchitectures()) }
    externalNativeBuild {
      cmake {
        arguments "-DANDROID_STL=c++_shared"
      }
    }
  }
  externalNativeBuild {
    cmake {
      path "src/main/cpp/CMakeLists.txt"
    }
  }
  sourceSets {
    main {
      // Same OTFs as iOS. Shipped as raw assets at the asset root.
      assets.srcDirs += file("../ios/Fonts")
    }
  }
}
